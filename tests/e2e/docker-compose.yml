name: blue-e2e

services:
  mtls-certs:
    image: alpine/openssl:3.5.4
    entrypoint: ["/bin/sh", "/fixtures/generate.sh"]
    volumes:
      - ./fixtures/mtls:/fixtures:ro
      - mtls-certs:/certs

  blue-base:
    image: ${BLUE_E2E_BASE_IMAGE:-blue-e2e-base:local}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      args:
        BLUE_DEPLOYMENT_VERSION: e2e
    profiles: ["build"]

  blue-rust:
    image: ${BLUE_E2E_RUST_IMAGE:-blue-e2e-rust:local}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: rust-artifacts
    profiles: ["build"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: governance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d governance"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ${BLUE_E2E_BASE_IMAGE:-blue-e2e-base:local}
    command: ["migrate"]
    environment:
      HARNESS_DATABASE_URL: postgres://harness:harness@postgres:5432/governance
    depends_on:
      postgres: { condition: service_healthy }

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/raw-sessions && mc mb --ignore-existing local/package-artifacts"]

  package-fixture-init:
    image: alpine:3.22
    command: ["/bin/sh", "-c", "base64 -d /source/e2e-package.tar.gz.b64 > /fixtures/e2e-package.tar.gz && chmod 0644 /fixtures/e2e-package.tar.gz"]
    volumes:
      - ./fixtures/package:/source:ro
      - package-fixture:/fixtures

  fake-upstream:
    image: node:22-bookworm-slim
    command: ["node", "/fixtures/server.mjs"]
    environment:
      LITELLM_MASTER_KEY: e2e-master-key
      E2E_PLUGIN_KEY: sk-e2e-wasm-plugin
    volumes:
      - ./fixtures/fake-upstream:/fixtures:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  docs:
    image: node:22-bookworm-slim
    command: ["node", "-e", "require('http').createServer((_, response) => response.end('Blue E2E docs\\n')).listen(3000, '0.0.0.0')"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  blue:
    image: ${BLUE_E2E_IMAGE:-blue-e2e-custom:local}
    build:
      context: ../..
      dockerfile: tests/e2e/fixtures/custom-provisioner/Dockerfile
      args:
        BLUE_BASE_IMAGE: ${BLUE_E2E_BASE_IMAGE:-blue-e2e-base:local}
    command: ["all"]
    environment:
      BLUE_ENVIRONMENT: development
      HARNESS_DATABASE_URL: postgres://harness:harness@postgres:5432/governance
      BLUE_CONFIG_FILE: /etc/blue/blue.yaml
      BLUE_ENABLE_INFERENCE_PROXY: "true"
      HARNESS_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      HARNESS_BOOTSTRAP_ADMIN_PASSWORD: change-me-in-production
      HARNESS_BOOTSTRAP_ORG_ID: e2e
      HARNESS_BOOTSTRAP_ORG_NAME: Blue E2E
      HARNESS_AUTH_SESSION_URL: http://127.0.0.1:3000/api/auth/get-session
      HARNESS_AUTH_PUBLIC_URL: http://127.0.0.1:3000
      HARNESS_AUTH_JWKS_URL: http://127.0.0.1:3000/api/auth/jwks
      HARNESS_AUTH_ISSUER: http://127.0.0.1:3000/api/auth
      HARNESS_AUTH_AUDIENCE: http://127.0.0.1:8080
      HARNESS_AUTH_MODE: password
      HARNESS_SCIM_BEARER_TOKEN: e2e-scim-token
      HARNESS_SCIM_GROUP_ROLE_MAPPINGS: '{"Blue Administrators":"admin"}'
      HARNESS_OAUTH_CLIENT_ID: blue-cli
      # Very short access-token TTL so the inference proxy's refresh-under-load
      # path is exercised within the test window.
      HARNESS_OAUTH_ACCESS_TOKEN_TTL_SECONDS: "3"
      # The short TTL intentionally causes many M2M token requests from the
      # runner's address; keep those from starving later device-flow tests.
      HARNESS_OAUTH_TOKEN_RATE_LIMIT_MAX: "1000"
      HARNESS_INFERENCE_PROXY_CLIENT_ID: blue-inference-proxy
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: e2e-better-auth-secret-at-least-32-bytes
      HARNESS_AUTH_RATE_LIMIT_ENABLED: "false"
      AUTH_DATABASE_URL: postgres://harness:harness@postgres:5432/governance
      CONTROL_API_URL: http://127.0.0.1:8080
      CONTROL_API_PUBLIC_URL: http://127.0.0.1:8080
      DOCS_URL: http://docs:3000
      HARNESS_BLOB_BUCKET: raw-sessions
      HARNESS_PACKAGE_BUCKET: package-artifacts
      HARNESS_BLOB_REGION: us-east-1
      HARNESS_BLOB_ENDPOINT: http://minio:9000
      HARNESS_BLOB_PUBLIC_ENDPOINT: http://minio:9000
      HARNESS_BLOB_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      HARNESS_GATEWAY_URL: http://fake-upstream:4010
      HARNESS_GATEWAY_TYPE: litellm
      HARNESS_LITELLM_ADMIN_KEY: e2e-master-key
      E2E_PLUGIN_KEY: sk-e2e-wasm-plugin
      HARNESS_PROVISIONER_EXECUTABLE_SHA256: ${HARNESS_PROVISIONER_EXECUTABLE_SHA256:?build and hash the E2E provisioner executable}
      HARNESS_GATEWAY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HARNESS_GATEWAY_JWT_ISSUER: http://127.0.0.1:8080
      HARNESS_GATEWAY_JWT_AUDIENCE: blue-inference-proxy
      HARNESS_GATEWAY_JWT_ACTIVE_KID: e2e-slim-rsa-1
      HARNESS_GATEWAY_JWT_PRIVATE_KEY_FILE: /gateway-jwt/jwt-signing-key.pem
      HARNESS_GATEWAY_JWT_JWKS_FILE: /gateway-jwt/jwks.json
      HARNESS_GATEWAY_JWKS_URL: https://127.0.0.1:8082/internal/gateway/jwks
      HARNESS_INFERENCE_PROXY_URL: http://blue:8081
      HARNESS_INFERENCE_PROXY_HEALTH_URL: http://127.0.0.1:8081
      HARNESS_INTERNAL_ALLOWED_CLIENT_ID: blue-inference-proxy
      HARNESS_INTERNAL_TRANSPORT_MODE: mtls
      HARNESS_INTERNAL_TLS_CERT_FILE: /certs/tls.crt
      HARNESS_INTERNAL_TLS_KEY_FILE: /certs/tls.key
      HARNESS_INTERNAL_TLS_CLIENT_CA_FILE: /certs/ca.crt
      HARNESS_INTERNAL_CA_FILE: /certs/ca.crt
      HARNESS_PROXY_CLIENT_IDENTITY_FILE: /certs/client.pem
      HARNESS_GATEWAY_RESOLVER_URL: https://127.0.0.1:8082/internal/gateway/resolve
      HARNESS_GATEWAY_EVENT_URL: https://127.0.0.1:8082/internal/gateway/events
      HARNESS_GATEWAY_CREDENTIAL_INVALID_URL: https://127.0.0.1:8082/internal/gateway/credential-invalid
      HARNESS_GATEWAY_LOG_URL: https://127.0.0.1:8082/internal/gateway/request-logs
      # M2M OAuth client-credentials auth to the Control API. The dashboard seeds
      # the confidential client from HARNESS_INFERENCE_PROXY_CLIENT_ID + secret.
      HARNESS_PROXY_OAUTH_TOKEN_URL: http://127.0.0.1:3000/api/auth/oauth2/token
      HARNESS_PROXY_OAUTH_CLIENT_ID: blue-inference-proxy
      HARNESS_PROXY_OAUTH_CLIENT_SECRET: e2e-proxy-oauth-secret
      HARNESS_PROXY_OAUTH_SCOPE: gateway:resolve
      HARNESS_PROXY_OAUTH_RESOURCE: http://127.0.0.1:8080
      # Force frequent re-resolution so the proxy→control-api hop runs often, and
      # raise the per-token limits so the load burst does not get rate limited.
      HARNESS_PROXY_CACHE_TTL_SECONDS: "1"
      HARNESS_PROXY_PER_TOKEN_RPS: "2000"
      HARNESS_PROXY_PER_TOKEN_BURST: "4000"
      HARNESS_PROXY_MAX_IN_FLIGHT: "10000"
      BLUE_ALLOW_INSECURE_DEV: "true"
    volumes:
      - ./fixtures/blue.yaml:/etc/blue/blue.yaml:ro
      - package-fixture:/fixtures:ro
      - mtls-certs:/certs:ro
      - ../e2e-slim/fixtures/jwks:/gateway-jwt:ro
    depends_on:
      mtls-certs: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      package-fixture-init: { condition: service_completed_successfully }
      fake-upstream: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/blue-healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  blue-governance-only:
    image: ${BLUE_E2E_IMAGE:-blue-e2e-custom:local}
    command: ["control-api"]
    environment:
      HARNESS_DATABASE_URL: postgres://harness:harness@postgres:5432/governance
      BLUE_CONFIG_FILE: /etc/blue/blue.yaml
      BLUE_HEALTHCHECK_COMPONENT: control-api
      HARNESS_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      HARNESS_AUTH_SESSION_URL: http://blue:3000/api/auth/get-session
      HARNESS_AUTH_PUBLIC_URL: http://127.0.0.1:3000
      HARNESS_AUTH_JWKS_URL: http://blue:3000/api/auth/jwks
      HARNESS_AUTH_ISSUER: http://127.0.0.1:3000/api/auth
      HARNESS_AUTH_AUDIENCE: http://127.0.0.1:8080
      HARNESS_BLOB_BUCKET: raw-sessions
      HARNESS_PACKAGE_BUCKET: package-artifacts
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      BLUE_ALLOW_INSECURE_DEV: "true"
    volumes:
      - ./fixtures/governance-only-blue.yaml:/etc/blue/blue.yaml:ro
    depends_on:
      blue: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/usr/local/bin/blue-healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  runner:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
      args:
        BLUE_E2E_RUST_IMAGE: ${BLUE_E2E_RUST_IMAGE:-blue-e2e-rust:local}
    profiles: ["test"]
    user: pwuser
    # Share Blue's network namespace so loopback development URLs exercise the
    # CLI's secure first-run discovery path without disabling URL validation.
    network_mode: service:blue
    environment:
      E2E_DASHBOARD_URL: http://127.0.0.1:3000
      E2E_CONTROL_API_URL: http://127.0.0.1:8080
      E2E_STATE_ROOT: /tmp/blue-e2e
      E2E_AGENT_LOG_DIR: /tmp/blue-e2e/agent-log
      CI: ${CI:-}
    volumes:
      - ./artifacts:/work/tests/e2e/artifacts
      - ./specs:/work/tests/e2e/specs:ro
      - ./support:/work/tests/e2e/support:ro
      - ./fixtures/bin:/work/tests/e2e/fixtures/bin:ro
      - ./coverage.json:/work/tests/e2e/coverage.json:ro
      - ./playwright.config.ts:/work/tests/e2e/playwright.config.ts:ro
      - package-fixture:/fixtures:ro
      - mtls-certs:/certs:ro
    depends_on:
      blue: { condition: service_healthy }
      blue-governance-only: { condition: service_healthy }
      docs: { condition: service_healthy }

volumes:
  package-fixture:
  mtls-certs:
