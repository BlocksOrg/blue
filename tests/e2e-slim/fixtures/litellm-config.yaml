# LiteLLM proxy config for the e2e-slim gateway path.
#
# The governed model names are REAL model ids (no synthetic aliases): the agent
# CLIs see names they recognize, and LiteLLM maps each onto the matching
# OpenRouter deployment, provider-matched so the native request format each
# agent speaks survives translation:
#   * claude-sonnet-5 -> the same Anthropic model on OpenRouter (claude sends
#     the /v1/messages shape)
#   * gpt-5.6-terra   -> the same OpenAI model on OpenRouter (codex sends
#     /v1/responses; opencode speaks OpenAI chat-completions)
#   * kimi-k2.6       -> Moonshot's model on OpenRouter (kimi-code's catalog
#     uses the bare short-name id; OpenRouter prefixes it with `moonshotai/`)
#
# The single OpenRouter key is injected from the OPENROUTER_API_KEY GitHub
# Actions secret. `drop_params` lets LiteLLM discard provider-unsupported params
# instead of erroring, which smooths the responses/messages translation path.
model_list:
  - model_name: gpt-5.6-terra
    litellm_params:
      model: openrouter/openai/gpt-5.6-terra
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: claude-sonnet-5
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: kimi-k2.6
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.6
      api_key: os.environ/OPENROUTER_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true
