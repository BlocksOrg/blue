server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The container sits behind a TLS-terminating load balancer, so nginx has no
  # way to rebuild its own public URL: an absolute redirect would leak this
  # listener's scheme and port (http://host:3000/...) and dead-end the browser.
  absolute_redirect off;
  port_in_redirect off;

  location / {
    # Serve the Astro directory-format page directly for extensionless URLs
    # (/manifesto -> /manifesto/index.html) instead of round-tripping a
    # trailing-slash redirect.
    try_files $uri $uri/index.html $uri/ =404;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
