server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The container sits behind a TLS-terminating load balancer, so nginx has no
  # way to rebuild its own public URL: an absolute redirect would leak this
  # listener's scheme and port (http://host:3000/...) and dead-end the browser.
  absolute_redirect off;
  port_in_redirect off;

  location / {
    # Serve the Astro directory-format page directly for extensionless URLs
    # (/manifesto -> /manifesto/index.html) instead of round-tripping a
    # trailing-slash redirect.
    try_files $uri $uri/index.html $uri/ =404;

    # Documents are never frozen: whatever max-age we set here is how long a
    # bad deploy stays live in visitors' browsers. Revalidating costs one
    # round trip and the ETag answers it with a 304 carrying no body.
    add_header Cache-Control "no-cache" always;
  }

  # Astro fingerprints these filenames, so the URL changes whenever the bytes
  # do and it is safe to cache them forever. `^~` keeps the regex block below
  # from claiming _astro/*.css and *.js.
  location ^~ /_astro/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Files copied verbatim from public/ keep a stable URL, so a long max-age
  # would strand the old bytes in caches we cannot purge. An hour is enough to
  # spare repeat visitors the transfer while keeping a replacement reachable.
  location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
