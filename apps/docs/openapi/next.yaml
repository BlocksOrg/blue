openapi: 3.1.0
info:
  title: Blue — Service Contract
  version: "0.1.0"
  description: >
    The client-side contract the `blue` CLI expects from the provisioned
    service. The reference `control-api` implements it; any BYO service that
    honors these shapes can be swapped in. Gateway-mode endpoints (pseudotoken
    issuance) are OPTIONAL — governance-only deployments need only
    `GET /governance-config`. CLI callers use OAuth 2.0 access tokens issued
    through RFC 8628 device authorization; dashboard callers use an HTTP-only
    Better Auth session cookie.

servers:
  - url: https://harness.example.com
    description: Replace with the Control API URL for your deployment.

tags:
  - name: System
    description: Service health and authenticated identity.
  - name: Configuration
    description: Personalized governance policy and client reconciliation state.
  - name: Gateway
    description: Per-user managed inference-gateway credential lifecycle.
  - name: Sessions
    description: Raw-session upload, metadata, and download lifecycle.
  - name: Administration
    description: Organization-administrator policy and client operations.
  - name: User management
    description: Organization user lifecycle, session revocation, and invitation operations.
  - name: Identity provisioning
    description: SCIM 2.0 user and group provisioning for an external identity provider.

security:
  - oauthDevice: []

paths:
  /.well-known/metaharness:
    get:
      operationId: discoverMetaharness
      tags: [System]
      summary: Discover Control API and OAuth device-flow settings
      description: Public, versioned bootstrap metadata containing no credentials or organization policy.
      security: []
      responses:
        "200":
          description: Metaharness deployment discovery document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetaharnessDiscovery" }

  /health:
    get:
      operationId: health
      tags: [System]
      summary: Liveness probe
      security: []
      responses:
        "200": { description: OK }

  /ready:
    get:
      operationId: ready
      tags: [System]
      summary: Readiness probe
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: Database unavailable or schema incompatible }

  /health/schema:
    get:
      operationId: schemaHealth
      tags: [System]
      summary: Check database schema compatibility
      security: []
      responses:
        "200": { description: Schema is compatible with this application generation }
        "503": { description: "Schema is incomplete, corrupted, or requires a newer application" }

  /health/worker:
    get:
      operationId: workerHealth
      tags: [System]
      summary: Check singleton background-worker freshness
      security: []
      responses:
        "200": { description: Worker is fresh or background work is disabled }
        "503": { description: Worker has not completed work within its freshness budget }

  /health/object-storage:
    get:
      operationId: objectStorageHealth
      tags: [System]
      summary: Check session and package object stores
      security: []
      responses:
        "200": { description: Both object stores are reachable }
        "503": { description: At least one object store is unavailable }

  /health/credential-resolver:
    get:
      operationId: credentialResolverHealth
      tags: [System]
      summary: Check the gateway credential resolver store
      security: []
      responses:
        "200": { description: Resolver storage is healthy or gateway mode is disabled }
        "503": { description: Resolver storage is unavailable }

  /metrics:
    get:
      operationId: metrics
      tags: [System]
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }

  /health/dependencies:
    get:
      operationId: dependencyHealth
      tags: [System]
      summary: Check Control API dependencies
      description: Checks PostgreSQL, blob buckets, and the inference proxy when configured. Available to administrators and members for CLI health diagnostics.
      responses:
        "200":
          description: Dependency health report; inspect the top-level status for degradation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DependencyHealthResponse" }

  /branding:
    get:
      operationId: getBranding
      tags: [System]
      summary: Fetch deployment-wide dashboard branding
      security: []
      responses:
        "200":
          description: Logo and favicon URLs used by authenticated and logged-out pages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }

  /auth/me:
    get:
      operationId: getCurrentIdentity
      tags: [System]
      summary: Resolve the current OAuth token or dashboard session
      responses:
        "200": { description: Current identity }
        "401": { description: "Missing, expired, or revoked service session" }

  /governance-config:
    get:
      operationId: getGovernanceConfig
      tags: [Configuration]
      summary: Fetch the governance config for the authenticated user/org
      description: >
        Returns which harnesses are allowed, per-harness managed config,
        MCP/skills, and — in gateway mode — the per-user pseudotoken embedded in
        the global `gateway` block. Response is scoped to the caller's
        org/groups (server-side).
      responses:
        "200":
          description: The governance config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceConfig" }
        "403": { description: Authenticated email has no provisioned gateway account }
        "409": { description: Gateway key provisioning is required }
        "426": { description: Client contract version or capabilities are insufficient }

  /harness-metadata:
    get:
      operationId: getHarnessMetadata
      tags: [Configuration]
      summary: Return the trusted compiled harness registry
      responses:
        "200":
          description: Harness aliases, labels, capabilities, and generation boundaries
          content:
            application/json:
              schema:
                type: object
                required: [contract_version, harnesses]
                properties:
                  contract_version: { type: integer }
                  harnesses:
                    type: array
                    items: { $ref: "#/components/schemas/HarnessMetadata" }
        "401": { description: Missing/invalid session token }

  /governance-config/events:
    get:
      operationId: watchGovernanceConfigRevisions
      tags: [Configuration]
      summary: Watch organization governance revision changes
      description: Optional SSE invalidation stream. It emits the current revision immediately, then emits newly committed revisions for the authenticated organization. Clients must continue to fetch configuration from `/governance-config`.
      responses:
        "200":
          description: Server-sent `revision` events whose JSON data contains the immutable revision ID
          content:
            text/event-stream:
              schema: { type: string }
        "401": { description: Missing/invalid session token }
        "403": { description: "Missing `governance:read` scope" }

  /gateway/status:
    get:
      operationId: getGatewayStatus
      tags: [Gateway]
      summary: Describe gateway policy and runtime readiness without contacting the gateway
      responses:
        "200":
          description: Gateway mode state and per-harness routing policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayStatusResponse" }

  /gateway/proxy/health:
    post:
      operationId: checkGatewayProxyHealth
      tags: [Gateway]
      summary: Ping the configured inference proxy
      description: Administrator-only server-side health request that does not expose gateway credentials.
      responses:
        "200":
          description: Current reachability and latency of the inference proxy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayProxyHealthResponse" }
        "400": { description: Inference proxy is not configured }
        "403": { description: Administrator access required }

  /gateway/key:
    get:
      operationId: getGatewayKey
      tags: [Gateway]
      summary: Get the authenticated user's managed gateway-key status
      description: Credential and pseudotoken values are never returned.
      responses:
        "200":
          description: Managed gateway-key status and non-secret metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayKeyResponse" }

  /gateway/key/ensure:
    post:
      operationId: ensureGatewayKey
      tags: [Gateway]
      summary: Provision or reconcile the authenticated user's managed gateway key
      description: Invokes the configured built-in or executable provisioner when the credential is missing, stale, failed previously, or its configuration or policy revision changed. Manual retries bypass provisioning backoff.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                manual: { type: boolean, default: false, description: Explicitly retry an errored or invalid credential and bypass recovery cooldown. }
      responses:
        "200":
          description: Current managed gateway-key status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayKeyResponse" }
        "403": { description: The provisioner reports that no gateway account exists for the authenticated user }

  /gateway/key/validate:
    post:
      operationId: validateGatewayKey
      tags: [Gateway]
      summary: Validate the authenticated user's stored upstream gateway key
      description: Contacts the provisioner at most once per minute. A confirmed invalid credential is cleared and reported as invalid; replacement requires a subsequent ensure call. A missing credential is reported without contacting the provisioner.
      responses:
        "200":
          description: Current managed gateway-key status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayKeyResponse" }
        "403": { description: The provisioner reports that no gateway account exists for the authenticated user }

  /gateway/request-logs:
    get:
      operationId: listGatewayRequestLogs
      tags: [Gateway]
      summary: List organization inference-proxy request metadata
      description: Administrator-only retained request metadata. Bodies, query strings, credentials, and arbitrary headers are never returned or retained.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - name: q
          in: query
          description: Case-insensitive literal search across path, model, profile name, repository, branch, and run ID.
          schema: { type: string, maxLength: 200 }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: profile_id, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: harness, in: query, schema: { type: string } }
        - { name: result, in: query, schema: { $ref: "#/components/schemas/GatewayRequestResult" } }
        - { name: occurred_from, in: query, description: Inclusive UTC calendar date., schema: { type: string, format: date } }
        - { name: occurred_to, in: query, description: Inclusive UTC calendar date., schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [occurred_desc, occurred_asc], default: occurred_desc } }
      responses:
        "200":
          description: A numbered page of retained request metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayRequestLogPage" }
        "400": { description: Invalid list parameters }
        "403": { description: Administrator access required }

  /gateway/request-logs/facets:
    get:
      operationId: getGatewayRequestLogFacets
      tags: [Gateway]
      summary: List organization request-log filter values
      description: Administrator-only filter values for the organization request-log list.
      parameters:
        - { name: user_q, in: query, description: Case-insensitive email substring; user results are limited to 10., schema: { type: string, maxLength: 200 } }
        - { name: selected_user_id, in: query, description: Relevant selected user to prioritize in the bounded result., schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Visible users, profiles, models, harnesses, and result categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayRequestLogFacets" }
        "403": { description: Administrator access required }

  /client-status:
    post:
      operationId: reportClientStatus
      tags: [Configuration]
      summary: Report a local client's applied revision and managed-file health
      security:
        - oauthDevice: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientStatusReport" }
      responses:
        "204": { description: Status recorded }

  /session-uploads/presign:
    post:
      operationId: presignSessionUpload
      tags: [Sessions]
      summary: Create a short-lived session artifact upload request
      description: >
        Reference path for the global session_upload.presign_url. Implementations
        may host this endpoint elsewhere. A typical AWS implementation returns
        an S3 presigned PUT and any headers that were included in its signature.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionUploadPresignRequest" }
      responses:
        "200":
          description: Short-lived provider-specific upload request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresignedUpload" }
        "401": { description: Missing/invalid session token }

  /session-uploads:
    get:
      operationId: listSessionUploads
      tags: [Sessions]
      summary: List captured sessions visible to the caller
      description: >
        Organization administrators see their organization for audit; members see
        owned and shared sessions. Resumable mode always applies own/shared picker visibility. Callers may use cursor parameters or
        numbered page parameters, but must not combine the two modes.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: q, in: query, description: Case-insensitive literal substring matched against native session ID and working directory., schema: { type: string, maxLength: 200 } }
        - { name: harness, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, complete, superseded, failed] } }
        - { name: updated_from, in: query, description: Inclusive UTC calendar date., schema: { type: string, format: date } }
        - { name: updated_to, in: query, description: Inclusive UTC calendar date., schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [updated_desc, updated_asc], default: updated_desc } }
        - { name: resumable, in: query, description: Return only owned or explicitly shared portable sessions; administrator audit access is not applied., schema: { type: boolean } }
      responses:
        "200":
          description: A cursor page or numbered page of database-registered captured sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapturedSessionList" }
        "400": { description: Invalid or incompatible list parameters }

  /session-uploads/facets:
    get:
      operationId: getSessionUploadFacets
      tags: [Sessions]
      summary: List users and harnesses available as captured-session filters
      description: Facets use the same organization and ownership visibility rules as the session list.
      parameters:
        - { name: user_q, in: query, description: Case-insensitive email substring; user results are limited to 10., schema: { type: string, maxLength: 200 } }
        - { name: selected_user_id, in: query, description: Relevant selected user to prioritize in the bounded result., schema: { type: string, format: uuid } }
      responses:
        "200": { description: Visible users and harnesses that own at least one captured session }

  /session-uploads/members:
    get:
      operationId: searchSessionShareMembers
      tags: [Sessions]
      summary: Search active organization members for session sharing
      parameters:
        - { name: q, in: query, description: Case-insensitive email substring; results are limited to 10., schema: { type: string, maxLength: 200 } }
      responses:
        "200": { description: Up to 10 matching active organization members other than the caller }

  /session-uploads/{id}:
    get:
      operationId: getSessionUpload
      tags: [Sessions]
      summary: Get captured-session metadata and artifact history
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Captured session detail }
        "403": { description: Session is outside the caller's visibility }

  /session-uploads/{id}/complete:
    post:
      operationId: completeSessionUpload
      tags: [Sessions]
      summary: Verify the uploaded object and commit its metadata
      description: The control API HEADs blob storage and checks size and SHA-256 metadata before making the artifact current.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Artifact registered as complete }
        "400": { description: Blob is absent or its metadata does not match }

  /session-uploads/{id}/download:
    post:
      operationId: createSessionDownload
      tags: [Sessions]
      summary: Create a short-lived download request for the current artifact
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Provider-specific presigned download URL }
        "410": { description: The artifact retention deadline has passed }

  /session-uploads/{id}/sharing:
    get:
      operationId: getSessionSharing
      tags: [Sessions]
      summary: Get the current sharing mode and active recipients
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: "Sharing mode, edit permission, recipient count, and active recipient identities" }
        "403": { description: Session is outside the caller's visibility }
    put:
      operationId: updateSessionSharing
      tags: [Sessions]
      summary: Replace owner-managed session sharing grants
      description: Idempotently sets private, workspace-wide, or selected-active-member access. Only the owner may call this endpoint.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [private, workspace, selected] }
                user_ids: { type: array, items: { type: string, format: uuid }, default: [] }
      responses:
        "200": { description: Sharing grants replaced }
        "403": { description: Caller is not the session owner }

  /admin/governance-config:
    get:
      operationId: getAdminGovernanceConfig
      tags: [Administration]
      summary: Read the organization's current editable YAML configuration
      responses:
        "200":
          description: Current YAML and revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminConfig" }
    put:
      operationId: updateAdminGovernanceConfig
      tags: [Administration]
      summary: Validate and save a new governance configuration revision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminConfig" }
      responses:
        "200":
          description: Saved revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminConfig" }
        "409": { description: Base revision is stale }

  /admin/governance-config/revisions:
    get:
      operationId: listAdminGovernanceRevisions
      tags: [Administration]
      summary: List recent governance configuration revisions
      responses:
        "200":
          description: Up to 100 revisions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GovernanceRevision" }

  /admin/blue-config/export:
    get:
      operationId: exportBlueConfig
      tags: [Administration]
      summary: Export the mounted deployment configuration with current governance
      responses:
        "200":
          description: Deployable YAML with literal secrets replaced by environment references
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlueConfigExport" }

  /admin/branding:
    put:
      operationId: updateBranding
      tags: [Administration]
      summary: Replace deployment-wide dashboard branding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Branding" }
      responses:
        "200":
          description: Saved branding settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "400": { description: A URL is invalid or too long }
        "403": { description: Administrator access required }

  /admin/package-catalog:
    get:
      operationId: listManagedPackageCatalog
      tags: [Administration]
      summary: List curated extension packages available to the organization
      responses:
        "200":
          description: Digest-pinned package catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManagedPackage" }

  /admin/package-source/inspect:
    post:
      operationId: inspectManagedPackageSource
      tags: [Administration]
      summary: Resolve, hash, and optionally mirror a managed repository source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [source_ref]
                  properties:
                    source_ref:
                      type: string
                      description: Public GitHub source in `github:owner/repository@ref` form or an immutable public HTTPS `.tar.gz` URL
                      examples:
                        - "github:BlocksOrg/agent-extensions@v1.2.0"
                        - "https://packages.example/extension-1.2.0.tar.gz"
                - type: object
                  required: [connection_id, repository, ref]
                  properties:
                    connection_id: { type: string }
                    repository: { type: string, example: "owner/repository" }
                    ref: { type: string, example: "v1.2.3" }
      responses:
        "200":
          description: Immutable source metadata for administrator confirmation
          content:
            application/json:
              schema:
                type: object
                required: [source_ref, sha256, size_bytes]
                properties:
                  source_ref: { type: string, format: uri }
                  artifact_id: { type: string, format: uuid }
                  resolved_commit: { type: string }
                  sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                  size_bytes: { type: integer, maximum: 104857600 }
        "400": { description: "Source is unsafe, unreachable, too large, or invalid" }

  /admin/package-source/connections:
    get:
      operationId: listManagedPackageSourceConnections
      tags: [Administration]
      summary: List repository connections allowed for the administrator's organization
      responses:
        "200":
          description: Safe connection metadata; credentials are never returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, provider, namespaces]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    provider: { type: string, enum: [github, bitbucket_cloud, bitbucket_data_center] }
                    namespaces: { type: array, items: { type: string } }

  /admin/governance-extensions:
    put:
      operationId: updateManagedExtensions
      tags: [Administration]
      summary: Save packages, per-harness overrides, and MCP servers as a new revision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateManagedExtensions" }
      responses:
        "200":
          description: Saved governance revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminConfig" }
        "409": { description: Base revision is stale }

  /admin/harnesses/{harness}/managed-config:
    get:
      operationId: getHarnessManagedConfig
      tags: [Administration]
      summary: Read one coding agent's managed configuration as YAML
      parameters:
        - name: harness
          in: path
          required: true
          schema: { type: string, description: Harness key from the compiled registry }
      responses:
        "200":
          description: Current managed configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessManagedConfig" }
    put:
      operationId: updateHarnessManagedConfig
      tags: [Administration]
      summary: Save one coding agent's managed configuration as a new revision
      parameters:
        - name: harness
          in: path
          required: true
          schema: { type: string, description: Harness key from the compiled registry }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateHarnessManagedConfig" }
      responses:
        "200":
          description: Saved governance revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessManagedConfig" }
        "400": { description: Harness or managed configuration is invalid }
        "409": { description: Base revision is stale }

  /admin/harnesses/managed-configs:
    get:
      operationId: listHarnessManagedConfigs
      tags: [Administration]
      summary: Read every supported coding agent's managed configuration as YAML
      responses:
        "200":
          description: Managed configurations from one governance revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessManagedConfigs" }

  /package-artifacts/{id}/download:
    post:
      operationId: downloadManagedPackageArtifact
      tags: [Governance]
      summary: Create a short-lived download request for an organization-scoped package artifact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Fresh presigned object-storage request
          content:
            application/json:
              schema:
                type: object
                required: [url, method, headers, expires_in_seconds]
                properties:
                  url: { type: string, format: uri }
                  method: { type: string, enum: [GET] }
                  headers: { type: object, additionalProperties: { type: string } }
                  expires_in_seconds: { type: integer }
        "404": { description: Artifact is not referenced by a currently deployed package visible to the authenticated user }

  /admin/identity/status:
    get:
      operationId: getAdminIdentityStatus
      tags: [User management]
      summary: Get the deployment-managed identity and provisioning status
      description: Returns non-secret OIDC mode and SCIM configuration metadata. Credential values are never returned.
      security: [{ oauthDevice: [] }, { dashboardSession: [] }]
      responses:
        "200":
          description: Managed identity status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityStatusResponse" }
        "403": { description: Administrator role required }

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [User management]
      summary: List users in the administrator's organization
      description: Includes active, suspended, and access-removed users so historical ownership remains visible.
      security: [{ oauthDevice: [] }, { dashboardSession: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: q, in: query, description: "Case-insensitive email or subject substring", schema: { type: string, maxLength: 200 } }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/GovernanceRole" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AdminUserStatus" } }
        - { name: provisioning_source, in: query, schema: { type: string, enum: [local, scim] } }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "403": { description: Administrator role required }

  /admin/users/options:
    get:
      operationId: listAdminUserOptions
      tags: [User management]
      summary: List non-removed organization users for selection controls
      security: [{ oauthDevice: [] }, { dashboardSession: [] }]
      responses:
        "200":
          description: User options
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
    post:
      operationId: searchAdminUserOptions
      tags: [User management]
      summary: Search active and already-selected organization users
      security: [{ oauthDevice: [] }, { dashboardSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string }
                selected_user_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: At most ten matching user options
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }

  /admin/users/{id}:
    get:
      operationId: getAdminUser
      tags: [User management]
      summary: Get an organization user
      security: [{ oauthDevice: [] }, { dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "404": { description: User does not exist in the administrator's organization }
    patch:
      operationId: updateAdminUser
      tags: [User management]
      summary: Change a user's role or active/suspended state
      description: Role and status changes revoke existing browser and CLI credentials. Removed users must be invited again.
      security: [{ oauthDevice: [] }, { dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminUser" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "409": { description: Self/protected/last-administrator guard or invalid lifecycle transition }
    delete:
      operationId: deleteAdminUser
      tags: [User management]
      summary: Delete a user's account access while retaining governance history
      description: Deletes the Better Auth identity, memberships, credentials, and gateway selection. The identifiable governance user and historical revisions, clients, and captured sessions remain.
      security: [{ oauthDevice: [] }, { dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "204": { description: Access removed; repeated deletion is idempotent }
        "409": { description: Self/protected/last-administrator guard }

  /admin/users/{id}/sessions/revoke:
    post:
      operationId: revokeAdminUserSessions
      tags: [User management]
      summary: Revoke all browser, OAuth, and device sessions for a user
      security: [{ oauthDevice: [] }, { dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "204": { description: All credentials revoked }
        "409": { description: User account has already been removed }

  /admin/invitations:
    get:
      operationId: listAdminInvitations
      tags: [User management]
      summary: List organization invitations
      security: [{ oauthDevice: [] }, { dashboardSession: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: status, in: query, schema: { type: string, enum: [outstanding] } }
        - { name: q, in: query, description: "Case-insensitive email substring", schema: { type: string, maxLength: 200 } }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/GovernanceRole" } }
      responses:
        "200":
          description: Invitations, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInvitationPage" }
    post:
      operationId: createAdminInvitation
      tags: [User management]
      summary: Invite an email address to create an organization account
      description: The recipient email and role are fixed. The recipient supplies only a password during acceptance.
      security: [{ oauthDevice: [] }, { dashboardSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminInvitation" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInvitation" }
        "409": { description: Email is already a member or has a pending invitation }

  /admin/invitations/{id}:
    get:
      operationId: getAdminInvitation
      tags: [User management]
      summary: Get an organization invitation
      security: [{ oauthDevice: [] }, { dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/InvitationId" }]
      responses:
        "200":
          description: Invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInvitation" }
        "404": { description: Invitation does not exist in the administrator's organization }
    delete:
      operationId: cancelAdminInvitation
      tags: [User management]
      summary: Cancel a pending invitation
      security: [{ oauthDevice: [] }, { dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/InvitationId" }]
      responses:
        "204": { description: Invitation canceled; repeated cancellation is idempotent }
        "409": { description: Accepted invitations cannot be canceled }

  /admin/invitations/{id}/resend:
    post:
      operationId: resendAdminInvitation
      tags: [User management]
      summary: Resend and renew a pending or expired invitation for 24 hours
      security: [{ oauthDevice: [] }, { dashboardSession: [] }]
      parameters: [{ $ref: "#/components/parameters/InvitationId" }]
      responses:
        "200":
          description: Renewed invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInvitation" }
        "409": { description: Invitation has already been accepted or canceled }

  /admin/client-status:
    get:
      operationId: listAdminClientStatus
      tags: [Administration]
      summary: List and filter local client status reports for the organization
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: q, in: query, description: "Case-insensitive literal substring matched against hostname, instance ID, and user email.", schema: { type: string, maxLength: 200 } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: harness, in: query, description: Matches harness names and structured harness inventory entries., schema: { type: string } }
        - { name: health, in: query, schema: { type: string, enum: [current, attention] } }
        - { name: last_seen_from, in: query, description: Inclusive UTC calendar date., schema: { type: string, format: date } }
        - { name: last_seen_to, in: query, description: Inclusive UTC calendar date., schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [last_seen_desc, last_seen_asc], default: last_seen_desc } }
      responses:
        "200":
          description: Numbered page of client status reports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientStatusPage" }
        "400": { description: Invalid list parameters }

  /admin/client-status/facets:
    get:
      operationId: getAdminClientStatusFacets
      tags: [Administration]
      summary: List users and harnesses available as client-status filters
      parameters:
        - { name: user_q, in: query, description: Case-insensitive email substring; user results are limited to 10., schema: { type: string, maxLength: 200 } }
        - { name: selected_user_id, in: query, description: Relevant selected user to prioritize in the bounded result., schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Organization-scoped client status facets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientStatusFacets" }

  /admin/client-status/{id}:
    delete:
      operationId: deleteAdminClientStatus
      tags: [Administration]
      summary: Remove an organization client inventory record
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Client inventory record removed }
        "404": { description: Client inventory record not found }

  /scim/v2/Users:
    get:
      operationId: listScimUsers
      tags: [Identity provisioning]
      summary: List or equality-filter provisioned users
      security: [{ scimBearer: [] }]
      parameters:
        - { name: filter, in: query, schema: { type: string } }
        - { name: startIndex, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: count, in: query, schema: { type: integer, minimum: 0, maximum: 200, default: 100 } }
      responses:
        "200": { description: SCIM ListResponse containing User resources }
    post:
      operationId: createScimUser
      tags: [Identity provisioning]
      summary: Provision a passwordless user
      security: [{ scimBearer: [] }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: "#/components/schemas/ScimUser" }
      responses:
        "201": { description: User provisioned }
        "409": { description: "Duplicate userName, externalId, or email" }

  /scim/v2/Users/{id}:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    get:
      operationId: getScimUser
      tags: [Identity provisioning]
      security: [{ scimBearer: [] }]
      responses: { "200": { description: SCIM User }, "404": { description: User not found } }
    put:
      operationId: replaceScimUser
      tags: [Identity provisioning]
      security: [{ scimBearer: [] }]
      requestBody:
        required: true
        content: { application/scim+json: { schema: { $ref: "#/components/schemas/ScimUser" } } }
      responses: { "200": { description: Replaced SCIM User } }
    patch:
      operationId: patchScimUser
      tags: [Identity provisioning]
      security: [{ scimBearer: [] }]
      requestBody:
        required: true
        content: { application/scim+json: { schema: { $ref: "#/components/schemas/ScimPatch" } } }
      responses: { "200": { description: Updated SCIM User } }
    delete:
      operationId: deleteScimUser
      tags: [Identity provisioning]
      security: [{ scimBearer: [] }]
      responses: { "204": { description: Authentication access removed } }

  /scim/v2/Groups:
    get:
      operationId: listScimGroups
      tags: [Identity provisioning]
      security: [{ scimBearer: [] }]
      parameters:
        - { name: filter, in: query, schema: { type: string } }
        - { name: startIndex, in: query, schema: { type: integer, minimum: 1 } }
        - { name: count, in: query, schema: { type: integer, minimum: 0, maximum: 200 } }
      responses: { "200": { description: SCIM ListResponse containing Group resources } }
    post:
      operationId: createScimGroup
      tags: [Identity provisioning]
      security: [{ scimBearer: [] }]
      requestBody:
        required: true
        content: { application/scim+json: { schema: { $ref: "#/components/schemas/ScimGroup" } } }
      responses: { "201": { description: Group provisioned } }

  /scim/v2/Groups/{id}:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    get:
      operationId: getScimGroup
      tags: [Identity provisioning]
      security: [{ scimBearer: [] }]
      responses: { "200": { description: SCIM Group } }
    put:
      operationId: replaceScimGroup
      tags: [Identity provisioning]
      security: [{ scimBearer: [] }]
      requestBody:
        required: true
        content: { application/scim+json: { schema: { $ref: "#/components/schemas/ScimGroup" } } }
      responses: { "200": { description: Replaced SCIM Group } }
    patch:
      operationId: patchScimGroup
      tags: [Identity provisioning]
      security: [{ scimBearer: [] }]
      requestBody:
        required: true
        content: { application/scim+json: { schema: { $ref: "#/components/schemas/ScimPatch" } } }
      responses: { "200": { description: Updated SCIM Group and memberships } }
    delete:
      operationId: deleteScimGroup
      tags: [Identity provisioning]
      security: [{ scimBearer: [] }]
      responses: { "204": { description: Group removed and affected roles recomputed } }

  /scim/v2/ServiceProviderConfig:
    get:
      operationId: getScimServiceProviderConfig
      tags: [Identity provisioning]
      security: [{ scimBearer: [] }]
      responses: { "200": { description: Supported SCIM capabilities } }

  /scim/v2/ResourceTypes:
    get:
      operationId: listScimResourceTypes
      tags: [Identity provisioning]
      security: [{ scimBearer: [] }]
      responses: { "200": { description: User and Group resource types } }

  /scim/v2/Schemas:
    get:
      operationId: listScimSchemas
      tags: [Identity provisioning]
      security: [{ scimBearer: [] }]
      responses: { "200": { description: Core User and Group schemas } }

components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    oauthDevice:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        OAuth 2.0 access token obtained through RFC 8628 at
        /api/auth/device/code and /api/auth/oauth2/token. The API enforces
        governance:read, session:write, and client-status:write as appropriate.
    dashboardSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: HTTP-only Better Auth dashboard session cookie.
    scimBearer:
      type: http
      scheme: bearer
      description: Deployment-managed bearer token dedicated to the workspace SCIM client.

  schemas:
    MetaharnessDiscovery:
      type: object
      required: [version, control_api_url, oauth]
      properties:
        version: { type: integer, const: 1 }
        control_api_url:
          type: string
          format: uri
          description: Canonical Control API URL and OAuth resource indicator.
        oauth:
          type: object
          required: [issuer, client_id, scopes]
          properties:
            issuer: { type: string, format: uri }
            client_id: { type: string, minLength: 1 }
            scopes:
              type: array
              items: { type: string, minLength: 1 }

    Branding:
      type: object
      required: [logo_url, favicon_url]
      properties:
        logo_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: Absolute HTTP or HTTPS URL for the dashboard logo
        favicon_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: Absolute HTTP or HTTPS URL for the browser favicon

    AdminConfig:
      type: object
      required: [revision, yaml, managed_yaml, document, package_audiences, created_at]
      properties:
        revision: { type: string, format: uuid, example: 251e6087-98cf-4861-9668-f09f537d5e4d }
        yaml: { type: string, description: Validated organization policy template }
        managed_yaml: { type: string, description: Editable policy projection with extension-owned fields omitted }
        document: { $ref: "#/components/schemas/GovernanceConfig" }
        package_audiences:
          type: object
          description: Revision-scoped deployment audience keyed by package ID; absent historical records are returned as organization-wide.
          additionalProperties: { $ref: "#/components/schemas/PackageAudience" }
        created_at: { type: string, format: date-time }

    UpdateAdminConfig:
      type: object
      required: [base_revision, managed_yaml]
      properties:
        base_revision: { type: string, format: uuid, example: 251e6087-98cf-4861-9668-f09f537d5e4d }
        managed_yaml: { type: string, description: Extension-free organization policy; published extensions are merged by the server }

    UpdateManagedExtensions:
      type: object
      required: [base_revision, packages]
      properties:
        base_revision: { type: string, format: uuid }
        packages:
          type: array
          items: { $ref: "#/components/schemas/ManagedPackage" }
        package_audiences:
          type: object
          description: Optional package audiences keyed by selected package ID; omitted entries deploy organization-wide.
          additionalProperties: { $ref: "#/components/schemas/PackageAudience" }
        package_overrides:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { $ref: "#/components/schemas/PackageOverride" }
        mcp:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/McpServer" }

    UpdateHarnessManagedConfig:
      type: object
      required: [base_revision, managed_config_yaml]
      properties:
        base_revision: { type: string, format: uuid }
        managed_config_yaml:
          type: string
          description: YAML mapping containing only the selected harness's managed settings
        version_requirement: { type: [string, "null"], description: Optional semver range enforced for the installed harness }
        allow_unverified_versions: { type: boolean, default: false, description: Permit versions beyond Blue's certified ceiling when constrained by an explicit version_requirement }

    HarnessManagedConfig:
      type: object
      required: [revision, harness, managed_config_yaml, allow_unverified_versions]
      properties:
        revision: { type: string, format: uuid }
        harness: { type: string, description: Harness key from the compiled registry }
        managed_config_yaml: { type: string }
        version_requirement: { type: [string, "null"] }
        allow_unverified_versions: { type: boolean }

    HarnessManagedConfigs:
      type: object
      required: [revision, configurations, allow_unverified_versions]
      properties:
        revision: { type: string, format: uuid }
        configurations:
          type: object
          additionalProperties: { type: string }
        version_requirements:
          type: object
          additionalProperties: { type: [string, "null"] }
        allow_unverified_versions:
          type: object
          additionalProperties: { type: boolean }

    GovernanceRevision:
      type: object
      required: [revision, created_at, origin]
      properties:
        revision: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        created_by_email: { type: [string, "null"], format: email }
        origin: { type: string, enum: [bootstrap, deployment, dashboard] }

    BlueConfigExport:
      type: object
      required: [yaml, redactions]
      properties:
        yaml: { type: string, description: Complete deployable Blue YAML with current organization governance }
        redactions:
          type: array
          items:
            type: object
            required: [path, environment_variable]
            properties:
              path: { type: string }
              environment_variable: { type: string }

    IdentityStatusResponse:
      type: object
      required: [auth_mode, scim]
      properties:
        auth_mode: { type: string, enum: [password, oidc] }
        scim:
          type: object
          required: [configured, group_role_mappings]
          properties:
            configured: { type: boolean, description: True when a SCIM bearer credential is configured. }
            group_role_mappings:
              type: object
              description: Exact SCIM group names mapped to governance roles.
              additionalProperties: { $ref: "#/components/schemas/GovernanceRole" }

    AdminUser:
      type: object
      required: [id, subject, email, role, active, status, protected, provisioning_source, managed, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        email: { type: string, format: email, example: developer@example.com }
        role: { $ref: "#/components/schemas/GovernanceRole" }
        active: { type: boolean, description: Compatibility projection of status == active }
        status: { $ref: "#/components/schemas/AdminUserStatus" }
        protected: { type: boolean, description: "Deployment-managed identity that cannot be demoted, suspended, or deleted" }
        provisioning_source: { type: string, enum: [local, scim] }
        managed: { type: boolean, description: True when role and lifecycle are controlled through SCIM }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminUserPage:
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }

    GovernanceRole:
      type: string
      enum: [admin, member]

    AdminUserStatus:
      type: string
      enum: [active, suspended, removed]

    UpdateAdminUser:
      type: object
      minProperties: 1
      properties:
        role: { $ref: "#/components/schemas/GovernanceRole" }
        status:
          type: string
          enum: [active, suspended]

    CreateAdminInvitation:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email, example: developer@example.com }
        role: { $ref: "#/components/schemas/GovernanceRole" }

    AdminInvitation:
      type: object
      required: [id, email, role, status, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/GovernanceRole" }
        status: { type: string, enum: [pending, accepted, canceled, expired] }
        inviter_email: { type: [string, "null"], format: email }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    AdminInvitationPage:
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminInvitation" } }
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }

    ScimUser:
      type: object
      required: [schemas, userName, active]
      properties:
        schemas: { type: array, items: { type: string }, example: ["urn:ietf:params:scim:schemas:core:2.0:User"] }
        id: { type: string, format: uuid, readOnly: true }
        externalId: { type: [string, "null"] }
        userName: { type: string }
        name:
          type: object
          properties:
            givenName: { type: [string, "null"] }
            familyName: { type: [string, "null"] }
        emails:
          type: array
          items:
            type: object
            required: [value]
            properties:
              value: { type: string, format: email }
              type: { type: string }
              primary: { type: boolean }
        active: { type: boolean }

    ScimGroup:
      type: object
      required: [schemas, displayName]
      properties:
        schemas: { type: array, items: { type: string }, example: ["urn:ietf:params:scim:schemas:core:2.0:Group"] }
        id: { type: string, format: uuid, readOnly: true }
        externalId: { type: [string, "null"] }
        displayName: { type: string }
        members:
          type: array
          items:
            type: object
            required: [value]
            properties:
              value: { type: string, format: uuid }
              display: { type: string, readOnly: true }

    ScimPatch:
      type: object
      required: [schemas, Operations]
      properties:
        schemas: { type: array, items: { type: string }, example: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"] }
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op: { type: string, enum: [add, remove, replace] }
              path: { type: string }
              value: {}

    AdminClientStatus:
      allOf:
        - $ref: "#/components/schemas/ClientStatusReport"
        - type: object
          required: [id, user_email, first_seen_at, last_seen_at, activity_status]
          properties:
            id: { type: string, format: uuid }
            user_email: { type: string, format: email, example: developer@example.com }
            first_seen_at: { type: string, format: date-time }
            last_seen_at: { type: string, format: date-time }
            activity_status: { type: string, enum: [recent, stale] }

    AdminClientStatusPage:
      type: object
      required: [items, page, per_page, total, total_pages, current_revision]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminClientStatus" } }
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
        current_revision: { type: [string, "null"], description: Latest governance revision for the organization. }

    AdminClientStatusFacets:
      type: object
      required: [users, harnesses]
      properties:
        users:
          type: array
          items:
            type: object
            required: [id, email]
            properties:
              id: { type: string, format: uuid }
              email: { type: string, format: email }
        harnesses: { type: array, items: { type: string } }

    GatewayKeyResponse:
      type: object
      required: [enabled, email, status]
      properties:
        enabled: { type: boolean }
        email: { type: string, format: email }
        status: { type: string, enum: [ready, missing, invalid, recovering, error] }
        alias: { type: [string, "null"] }
        external_id: { type: [string, "null"], description: "Opaque gateway identifier, never the credential value." }
        expires_at: { type: [string, "null"], format: date-time }
        last_reconciled_at: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"] }
        invalidated_at: { type: [string, "null"], format: date-time }
        invalidation_reason: { type: [string, "null"] }
        next_retry_at: { type: [string, "null"], format: date-time }

    GatewayHarnessStatus:
      type: object
      required: [name, gateway_type]
      properties:
        name: { type: string, example: codex }
        gateway_type: { type: string, example: litellm }

    GatewayStatusResponse:
      type: object
      required: [enabled, runtime_configured]
      properties:
        enabled: { type: boolean, description: True when the global gateway policy enables gateway mode. }
        runtime_configured: { type: boolean, description: True when all required server-side gateway settings are present. }
        inference_proxy_url: { type: [string, "null"], format: uri, description: Administrator-only inference proxy URL. }
        upstream_gateway_url: { type: [string, "null"], format: uri, description: Administrator-only upstream inference gateway URL. }
        provisioner_type: { type: [string, "null"], description: Administrator-only built-in or executable provisioner selected by configuration. }
        harnesses: { type: array, description: Administrator-only routed harness details., items: { $ref: "#/components/schemas/GatewayHarnessStatus" } }
        runtime_checks:
          description: Administrator-only configuration-presence checks. Credential values are never returned.
          oneOf:
            - $ref: "#/components/schemas/GatewayRuntimeChecks"
            - type: "null"

    GatewayProxyHealthResponse:
      type: object
      required: [status, checked_at, latency_ms]
      properties:
        status: { type: string, enum: [healthy, unhealthy] }
        checked_at: { type: string, format: date-time }
        latency_ms: { type: integer, minimum: 0 }
        http_status: { type: [integer, "null"], minimum: 100, maximum: 599 }
        error: { type: [string, "null"] }

    DependencyHealthCheck:
      type: object
      required: [name, status, latency_ms]
      properties:
        name: { type: string }
        status: { type: string, enum: [healthy, unhealthy] }
        latency_ms: { type: integer, minimum: 0 }
        error: { type: [string, "null"] }

    DependencyHealthResponse:
      type: object
      required: [status, checked_at, checks]
      properties:
        status: { type: string, enum: [healthy, degraded] }
        checked_at: { type: string, format: date-time }
        checks:
          type: array
          items: { $ref: "#/components/schemas/DependencyHealthCheck" }

    GatewayRuntimeChecks:
      type: object
      required: [gateway_policy, gateway_url, inference_proxy_url, provisioner, secret_encryption, internal_auth]
      properties:
        gateway_policy: { type: boolean }
        gateway_url: { type: boolean }
        inference_proxy_url: { type: boolean }
        provisioner: { type: boolean }
        secret_encryption: { type: boolean }
        internal_auth: { type: boolean }

    GatewayRequestResult:
      type: string
      enum: [success, redirect, client_error, server_error, transport_error]

    GatewayRequestLog:
      type: object
      required: [id, user_id, user_email, occurred_at, method, path, result, upstream_latency_ms]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        user_email: { type: string, format: email }
        profile_id: { type: [string, "null"] }
        profile_name: { type: [string, "null"] }
        occurred_at: { type: string, format: date-time }
        method: { type: string }
        path: { type: string, description: Request path without query parameters. }
        model: { type: [string, "null"] }
        http_status: { type: [integer, "null"], minimum: 100, maximum: 599 }
        result: { $ref: "#/components/schemas/GatewayRequestResult" }
        upstream_latency_ms: { type: integer, format: int64, minimum: 0, description: Time until upstream response headers or a transport failure. }
        harness: { type: [string, "null"] }
        repository: { type: [string, "null"] }
        branch: { type: [string, "null"] }
        commit_sha: { type: [string, "null"] }
        dirty: { type: [boolean, "null"] }
        run_id: { type: [string, "null"] }

    GatewayRequestLogPage:
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GatewayRequestLog" } }
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }

    GatewayRequestLogFacets:
      type: object
      required: [users, profiles, models, harnesses, results]
      properties:
        users:
          type: array
          items:
            type: object
            required: [id, email]
            properties:
              id: { type: string, format: uuid }
              email: { type: string, format: email }
        profiles:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
              name: { type: [string, "null"] }
        models: { type: array, items: { type: string } }
        harnesses: { type: array, items: { type: string } }
        results: { type: array, items: { $ref: "#/components/schemas/GatewayRequestResult" } }

    ClientStatusReport:
      type: object
      required: [instance_id, client_version, platform, applied, files_ok]
      properties:
        instance_id: { type: string, example: workstation-f3d151 }
        hostname: { type: [string, "null"], example: developer-laptop }
        client_version: { type: string, example: 0.1.0 }
        platform: { type: string, example: macos }
        config_revision: { type: [string, "null"] }
        applied: { type: boolean }
        files_ok: { type: boolean }
        harnesses:
          type: array
          items:
            oneOf:
              - type: string
                description: Applied harness name
              - $ref: "#/components/schemas/HarnessInventoryEntry"
        packages:
          type: array
          items: { $ref: "#/components/schemas/PackageStatus" }
        reconciliation_attempt:
          oneOf:
            - $ref: "#/components/schemas/ReconciliationAttempt"
            - type: "null"
        error: { type: [string, "null"] }

    ReconciliationAttempt:
      type: object
      description: A failed JIT reconciliation attempted before launching a harness.
      required: [harness, revision]
      properties:
        harness: { type: string, description: Harness key from the compiled registry }
        revision: { type: string }
    GovernanceConfig:
      type: object
      required: [revision, allowed_harnesses]
      properties:
        revision: { type: string, description: "Reconcile key; daemon acts on change", example: 251e6087-98cf-4861-9668-f09f537d5e4d }
        contract_version: { type: integer, default: 1, description: Governance wire contract version }
        required_capabilities:
          type: array
          items: { type: string, enum: [adapter_intervals, compiled_harness_registry, transactional_reconcile, unverified_harness_versions, versioned_state] }
        minimum_client_version: { type: string, description: Operator-visible rollout floor; required capabilities enforce compatibility }
        ttl_seconds: { type: integer, description: Client cache TTL (default 300), example: 300 }
        required: { type: boolean, description: "If true, client fails closed without fresh config" }
        allowed_harnesses:
          type: array
          items: { type: string, description: Harness key from the compiled registry }
        harnesses:
          type: object
          additionalProperties: { $ref: "#/components/schemas/HarnessPolicy" }
        packages:
          type: array
          items: { $ref: "#/components/schemas/ManagedPackage" }
        gateway: { $ref: "#/components/schemas/GatewayConfig" }
        session_upload: { $ref: "#/components/schemas/SessionUploadConfig" }
        telemetry:
          type: object
          properties:
            sink_url: { type: string }

    HarnessInventoryEntry:
      type: object
      required: [name, api_allowed, client_supported, installed, reconciled]
      properties:
        name: { type: string }
        api_allowed: { type: boolean }
        client_supported: { type: boolean }
        installed: { type: boolean }
        path: { type: string }
        raw_version: { type: string }
        version: { type: string }
        compatibility_profile: { type: string }
        compatibility_deprecated: { type: boolean }
        compatibility_error: { type: string }
        compatibility_warning: { type: string }
        reconciled: { type: boolean }

    HarnessMetadata:
      type: object
      required: [key, aliases, label, description, binary_names, install_command_template, capabilities, component_rules, generations]
      properties:
        key: { type: string }
        aliases: { type: array, items: { type: string } }
        label: { type: string }
        description: { type: string }
        binary_names: { type: array, items: { type: string } }
        install_command_template: { type: string }
        capabilities: { type: array, description: "Backward-compatible union derived from all generation specifications", items: { type: string } }
        component_rules:
          type: object
          description: Backward-compatible summary derived from the current generation; prefer generations[].component_rules.
          required: [agents_require_plugin, hooks_require_plugin, hooks_as_plugin_modules]
          properties:
            agents_require_plugin: { type: boolean }
            hooks_require_plugin: { type: boolean }
            hooks_as_plugin_modules: { type: boolean }
        generations:
          type: array
          items:
            type: object
            required: [profile, introduced, verified_before, lifecycle, capabilities, component_rules]
            properties:
              profile: { type: string }
              introduced: { type: string }
              before: { type: [string, "null"], description: Exclusive upper bound of the breaking compatibility generation }
              verified_before: { type: string, description: Exclusive upper bound of releases certified against this implementation }
              lifecycle: { type: string, enum: [supported, deprecated] }
              capabilities: { type: array, items: { type: string } }
              component_rules:
                type: object
                required: [agents_require_plugin, hooks_require_plugin, hooks_as_plugin_modules]
                properties:
                  agents_require_plugin: { type: boolean }
                  hooks_require_plugin: { type: boolean }
                  hooks_as_plugin_modules: { type: boolean }

    HarnessPolicy:
      type: object
      properties:
        version_requirement: { type: string, description: Semver range required for the locally installed harness }
        allow_unverified_versions: { type: boolean, default: false, description: Permit matching releases beyond Blue's certified ceiling; requires version_requirement }
        managed_config: { $ref: "#/components/schemas/ManagedConfig" }
        mcp:
          type: array
          description: >
            Additive MCP suggestions. An enabled entry is installed only when
            the local harness has no MCP with the same name; existing local
            MCPs are never overwritten, disabled, or removed.
          items: { $ref: "#/components/schemas/McpServer" }
        package_overrides:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PackageOverride" }

    ManagedPackage:
      type: object
      required: [id, version, source_ref, sha256]
      properties:
        id: { type: string, pattern: "^[a-z0-9-]+$" }
        name: { type: string }
        version: { type: string }
        source_ref: { type: string, description: Immutable HTTPS or local .tar.gz archive }
        artifact_id: { type: string, format: uuid, description: Organization-scoped mirrored artifact }
        sha256: { type: string, pattern: "^[A-Fa-f0-9]{64}$" }
        platform_sources:
          type: object
          description: Exact `<os>-<arch>` archive overrides; clients require a matching entry when this map is present.
          additionalProperties: { $ref: "#/components/schemas/PackageSource" }
        settings: { type: object, additionalProperties: true }
        adapters:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PackageAdapter" }

    PackageSource:
      type: object
      required: [source_ref, sha256]
      properties:
        source_ref: { type: string, description: Immutable HTTPS or local .tar.gz archive }
        artifact_id: { type: string, format: uuid, description: Organization-scoped mirrored artifact }
        sha256: { type: string, pattern: "^[A-Fa-f0-9]{64}$" }

    PackageAudience:
      type: object
      required: [scope, user_ids]
      properties:
        scope: { type: string, enum: [organization, users] }
        user_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }

    PackageAdapter:
      type: object
      description: >
        All paths are archive-root-relative. skills_dir may identify an exact
        skill folder or a collection of skill folders. Codex/Claude agents and
        hooks require plugin_dir; OpenCode hooks are declared as plugin modules.
      properties:
        introduced: { type: string, description: Inclusive harness-version lower bound for adapter availability; defaults to 0.0.0 }
        before: { type: string, description: Exclusive harness-version upper bound for adapter availability }
        plugin_dir: { type: string }
        skills_dir: { type: string }
        agents_dir: { type: string }
        hooks_file: { type: string }
        plugins: { type: array, items: { type: string } }
        helpers:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PlatformAsset" }
        variants:
          type: array
          description: Ordered half-open layouts selected within adapter availability; intervals must not overlap or leave gaps without a fallback.
          items: { $ref: "#/components/schemas/PackageAdapterVariant" }

    PackageAdapterVariant:
      type: object
      required: [introduced]
      properties:
        introduced: { type: string, description: Inclusive semantic-version lower bound }
        before: { type: string, description: Exclusive semantic-version upper bound; omit for open-ended }
        plugin_dir: { type: string }
        skills_dir: { type: string }
        agents_dir: { type: string }
        hooks_file: { type: string }
        plugins: { type: array, items: { type: string } }
        helpers:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PlatformAsset" }

    PlatformAsset:
      type: object
      properties:
        paths:
          type: object
          description: Archive paths keyed by os-architecture, with optional default.
          additionalProperties: { type: string }

    PackageOverride:
      type: object
      properties:
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: true }

    PackageStatus:
      type: object
      required: [id, version, sha256, harness, state]
      properties:
        id: { type: string }
        version: { type: string }
        sha256: { type: string }
        harness: { type: string }
        state: { type: string, enum: [applied, drifted, pending, failed, quarantined] }
        error: { type: [string, "null"] }

    ManagedConfig:
      type: object
      description: Known keys are typed; unknown keys are preserved forward-compatibly.
      properties:
        model: { type: string }
        approval_policy: { type: string }
        sandbox_mode: { type: string }
        auto_approve: { type: boolean }
        reasoning_effort:
          type: string
          description: Harness model thinking/reasoning effort, such as medium.
        fast_mode:
          type: boolean
          description: Whether accelerated service-tier selection is available; Codex maps false to features.fast_mode=false and service_tier=default.
      additionalProperties: true

    GatewayConfig:
      type: object
      required: [type]
      description: >
        Present ⇒ gateway mode for every allowed harness; omit ⇒ governance-only.
        proxy_url and pseudotoken are runtime fields injected by the control API
        when it delivers the policy to an authenticated client.
      properties:
        type: { type: string, description: Deployment-defined gateway adapter identifier. }
        proxy_url: { type: string, description: Runtime inference proxy URL injected at delivery time }
        pseudotoken:
          type: string
          description: >
            Runtime-only per-user opaque stand-in (psk_…). Durable-but-revocable;
            the inference proxy swaps it for an upstream gateway credential. The control
            API injects it into the authenticated client's config response.
        auth_style:
          type: string
          enum: [bearer]
          default: bearer
          description: Compatibility field; bearer is the only supported client-to-proxy authentication style.

    McpServer:
      type: object
      required: [name]
      properties:
        name: { type: string }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        url: { type: string }
        transport: { type: string }
        disabled: { type: boolean }

    SessionUploadConfig:
      type: object
      required: [presign_url]
      description: >
        Global opt-in portable-session capture. When present, every compatible
        supported harness registers its native hook. The authenticated endpoint returns a
        short-lived provider-specific blob upload request.
      properties:
        presign_url: { type: string, format: uri }

    SessionUploadPresignRequest:
      type: object
      required: [harness, session_id, sha256, size_bytes, content_type]
      properties:
        harness: { type: string, description: Harness key from the compiled registry }
        compatibility_profile: { type: string, example: claude-v1, description: "Compiled harness adapter profile that produced the upload. When omitted, the upload is recorded without a profile." }
        session_id: { type: string, example: codex-session-20260827 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$", example: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
        size_bytes: { type: integer, example: 48217 }
        content_type: { type: string, example: application/x-ndjson }
        cwd: { type: [string, "null"] }
        artifact_format: { type: string, enum: [legacy-raw, blue-session-bundle-v1], default: legacy-raw }
        resumable: { type: boolean, default: false }
        title: { type: [string, "null"], maxLength: 256 }
        summary: { type: [string, "null"], maxLength: 1024 }
        captured_at_unix_ms: { type: integer, minimum: 0 }
        repository_root: { type: [string, "null"], maxLength: 4096 }
        repository_remote: { type: [string, "null"], maxLength: 4096 }

    PresignedUpload:
      type: object
      required: [upload_id, status, headers]
      properties:
        upload_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, complete] }
        upload_url: { type: [string, "null"], format: uri }
        method: { type: [string, "null"], enum: [PUT, POST, null] }
        headers:
          type: object
          additionalProperties: { type: string }
        complete_url: { type: [string, "null"], description: Authenticated endpoint called after blob upload }

    CapturedSession:
      type: object
      required: [id, user_id, user_email, harness, compatibility_profile, native_session_id, artifact_format, resumable, sharing_mode, share_recipient_count, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        user_email: { type: string, format: email }
        harness: { type: string }
        compatibility_profile: { type: string }
        native_session_id: { type: string }
        cwd: { type: [string, "null"] }
        artifact_format: { type: string }
        resumable: { type: boolean }
        title: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        source_captured_at: { type: [string, "null"], format: date-time }
        repository:
          type: object
          properties:
            root: { type: [string, "null"] }
            remote: { type: [string, "null"] }
        sharing_mode: { type: string, enum: [private, workspace, selected] }
        share_recipient_count: { type: integer, minimum: 0 }
        shared: { type: boolean, description: Present in resumable picker mode. }
        updated_at: { type: string, format: date-time }
        status: { type: [string, "null"] }
        size_bytes: { type: [integer, "null"] }
        content_type: { type: [string, "null"] }
        retention_expires_at: { type: [string, "null"], format: date-time }

    CapturedSessionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CapturedSession" } }
        next_cursor: { type: [string, "null"], format: uuid }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
