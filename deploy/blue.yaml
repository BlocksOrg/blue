# Governance-only Blue deployment configuration. Set BLUE_CONFIG_FILE to this file.
# Environment variables referenced here are resolved by the Control API.

control_api:
  listen: 0.0.0.0:8080
  database_url: os.environ/HARNESS_DATABASE_URL

  bootstrap:
    organization_slug: dev
    organization_name: Development
    admin_subject: admin
    admin_email: os.environ/HARNESS_BOOTSTRAP_ADMIN_EMAIL

  auth:
    public_url: os.environ/HARNESS_AUTH_PUBLIC_URL
    session_url: os.environ/HARNESS_AUTH_SESSION_URL
    jwks_url: os.environ/HARNESS_AUTH_JWKS_URL
    issuer: os.environ/HARNESS_AUTH_ISSUER
    audience: os.environ/HARNESS_AUTH_AUDIENCE
    client_id: os.environ/HARNESS_OAUTH_CLIENT_ID

  identity:
    mode: os.environ/HARNESS_AUTH_MODE
    scim_bearer_token: os.environ/HARNESS_SCIM_BEARER_TOKEN
    group_role_mappings: os.environ/HARNESS_SCIM_GROUP_ROLE_MAPPINGS

  blob_storage:
    provider: s3
    bucket: os.environ/HARNESS_BLOB_BUCKET
    region: os.environ/HARNESS_BLOB_REGION
    endpoint: os.environ/HARNESS_BLOB_ENDPOINT
    public_endpoint: os.environ/HARNESS_BLOB_PUBLIC_ENDPOINT
    force_path_style: os.environ/HARNESS_BLOB_FORCE_PATH_STYLE
    presign_ttl_seconds: 300
    retention_days: 30
    auth:
      mode: iam

  package_artifacts:
    bucket: os.environ/HARNESS_PACKAGE_BUCKET

  gateway_request_logs:
    retention_days: 30

  package_sources:
    connections:
      - id: bitbucket-blocksorg
        name: BlocksOrg Bitbucket
        provider: bitbucket_cloud
        token: os.environ/HARNESS_BITBUCKET_TOKEN
        organizations:
          dev: [blocksorg]

# Organization policy seeded into the database. With the gateway overlay, its `type`
# is projected into this policy; runtime settings and secrets never leave the server.
governance:
  revision: "2026-09-06.1"
  contract_version: 3
  required_capabilities:
    - adapter_intervals
    - compiled_harness_registry
    - transactional_reconcile
    # Required when any harness enables allow_unverified_versions.
    # - unverified_harness_versions
    - versioned_state
    # Required when the gateway overlay is active.
    - gateway_inference_jwt
  # Required when harness version ranges or versioned package adapters are used.
  minimum_client_version: "0.1.0"
  ttl_seconds: 300
  required: true
  allowed_harnesses: [codex, claude, kimi, opencode]

  harnesses:
    codex:
      # version_requirement: ">=0.149.0, <0.150.0"
      # To deliberately run beyond Blue's certified release ceiling, set an
      # explicit range and opt in. This may break when the vendor changes its
      # config format. Also add unverified_harness_versions to
      # required_capabilities so older clients fail closed.
      # allow_unverified_versions: true
      managed_config:
        model: gpt-5.6-sol
        reasoning_effort: low
        fast_mode: false
        sandbox_mode: workspace-write
    claude:
      # Managed plugins and standalone skills are supported from this adapter
      # generation onward. Keep the local stack from selecting an older native
      # layout for packages added through the dashboard.
      version_requirement: ">=2.0.12, <2.1.253-0"
      managed_config:
        model: claude-opus-4-8
    kimi:
      managed_config:
        model: moonshot-ai/kimi-k2.6
        auto_approve: true
    opencode:
      managed_config:
        model: anthropic/claude-opus-4-8

# Curated choices shown by Extensions. Selecting one copies its immutable,
# digest-pinned recipe into an organization governance revision.
package_catalog:
  packages:
    - id: ponytail
      name: Ponytail
      version: "4.9.0"
      source_ref: https://codeload.github.com/DietrichGebert/ponytail/tar.gz/0a4dd63ad4541f4f655c4108a295916f3c1d8fda
      sha256: "5f6821b85ccc6b44d356e7331c18530884c5a703ba8022d11c3365c8a2cf7648"
      adapters:
        codex:
          plugin_dir: &ponytail_root ponytail-0a4dd63ad4541f4f655c4108a295916f3c1d8fda
        claude:
          introduced: 2.0.12
          plugin_dir: *ponytail_root
        kimi:
          skills_dir: ponytail-0a4dd63ad4541f4f655c4108a295916f3c1d8fda/skills
        opencode:
          skills_dir: ponytail-0a4dd63ad4541f4f655c4108a295916f3c1d8fda/skills
          plugins: [ponytail-0a4dd63ad4541f4f655c4108a295916f3c1d8fda/.opencode/plugins/ponytail.mjs]

    - id: rtk
      name: RTK
      version: "0.46.0"
      source_ref: https://github.com/rtk-ai/rtk/releases/download/v0.46.0/rtk-aarch64-apple-darwin.tar.gz
      sha256: "484e5dd2b4bfdbbb910727a0ba1e2d63b2e23efa922cfcc7300fd131bca3e10a"
      platform_sources:
        macos-aarch64:
          source_ref: https://github.com/rtk-ai/rtk/releases/download/v0.46.0/rtk-aarch64-apple-darwin.tar.gz
          sha256: "484e5dd2b4bfdbbb910727a0ba1e2d63b2e23efa922cfcc7300fd131bca3e10a"
        macos-x86_64:
          source_ref: https://github.com/rtk-ai/rtk/releases/download/v0.46.0/rtk-x86_64-apple-darwin.tar.gz
          sha256: "67eb651fa9cfc4a4ea65876242eb71b8837abdac40521d0dd363214ec1a068dd"
        linux-aarch64:
          source_ref: https://github.com/rtk-ai/rtk/releases/download/v0.46.0/rtk-aarch64-unknown-linux-gnu.tar.gz
          sha256: "e8c2e1787f46017ea7c5a711b2bc6a7f7cf61c7ad69385b4c1e4daff1135dcd1"
        linux-x86_64:
          source_ref: https://github.com/rtk-ai/rtk/releases/download/v0.46.0/rtk-x86_64-unknown-linux-musl.tar.gz
          sha256: "79aa5b89c69566bbfeceb66c8a27cfbe52237fc7ee3e683115f43745a3262d21"
      adapters:
        codex:
          helpers: &rtk_helpers
            rtk:
              paths:
                default: rtk
        claude:
          helpers: *rtk_helpers
        kimi:
          helpers: *rtk_helpers
        opencode:
          helpers: *rtk_helpers
