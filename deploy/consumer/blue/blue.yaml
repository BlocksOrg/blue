control_api:
  listen: 0.0.0.0:8080
  database_url: os.environ/HARNESS_DATABASE_URL
  bootstrap:
    organization_slug: os.environ/HARNESS_BOOTSTRAP_ORG_ID
    organization_name: os.environ/HARNESS_BOOTSTRAP_ORG_NAME
    admin_subject: admin
    admin_email: os.environ/HARNESS_BOOTSTRAP_ADMIN_EMAIL
  auth:
    public_url: os.environ/HARNESS_AUTH_PUBLIC_URL
    session_url: http://127.0.0.1:3000/api/auth/get-session
    jwks_url: http://127.0.0.1:3000/api/auth/jwks
    issuer: os.environ/HARNESS_AUTH_ISSUER
    audience: os.environ/HARNESS_AUTH_AUDIENCE
    client_id: os.environ/HARNESS_OAUTH_CLIENT_ID
  identity:
    mode: os.environ/HARNESS_AUTH_MODE
    scim_bearer_token: os.environ/HARNESS_SCIM_BEARER_TOKEN
    group_role_mappings: os.environ/HARNESS_SCIM_GROUP_ROLE_MAPPINGS
  blob_storage:
    provider: s3
    bucket: os.environ/HARNESS_BLOB_BUCKET
    region: os.environ/HARNESS_BLOB_REGION
    presign_ttl_seconds: 300
    retention_days: 30
    auth:
      mode: iam
  package_artifacts:
    bucket: os.environ/HARNESS_PACKAGE_BUCKET

