governance:
  revision: "2026-08-30.1"
  contract_version: 3
  required_capabilities:
    - adapter_intervals
    - compiled_harness_registry
    - transactional_reconcile
    - versioned_state
    # Required when gateway is enabled.
    # - gateway_inference_jwt
  minimum_client_version: "0.1.0"
  ttl_seconds: 300
  required: true
  allowed_harnesses: [codex, claude, kimi, opencode]
  harnesses:
    codex: { managed_config: {} }
    claude: { managed_config: {} }
    kimi: { managed_config: {} }
    opencode: { managed_config: {} }
