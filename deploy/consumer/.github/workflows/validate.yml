name: Validate deployment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-wasip2
      - run: cargo check --locked --manifest-path provisioner/Cargo.toml --target wasm32-wasip2
      - run: docker build -t blue-provisioner:check .
      - run: docker run --rm --entrypoint sha256sum blue-provisioner:check /module/provisioner.wasm
      - run: helm lint chart/blue -f values.yaml
      - run: >-
          helm template blue chart/blue -f values.yaml
          --set blue.provisionerModule.enabled=true
          --set blue.provisionerModule.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --set blue.provisionerModule.moduleSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      - run: tofu fmt -check -recursive infra/aws
      - run: tofu -chdir=infra/aws init -backend=false
      - run: tofu -chdir=infra/aws validate
