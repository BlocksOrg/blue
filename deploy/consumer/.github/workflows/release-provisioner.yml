name: Release provisioner module

on:
  push:
    tags: ["provisioner-v*.*.*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/blue-gateway-provisioner

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - run: |
          docker pull "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          module_sha="$(docker run --rm --entrypoint sha256sum "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}" /module/provisioner.wasm | awk '{print $1}')"
          {
            echo "OCI digest: `${{ steps.build.outputs.digest }}`"
            echo "Module SHA-256: `$module_sha`"
          } >> "$GITHUB_STEP_SUMMARY"
