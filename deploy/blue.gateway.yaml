# Overlay for gateway mode. Merge with blue.yaml by setting
# BLUE_CONFIG_OVERLAY_FILES=/etc/blue/blue.gateway.yaml.
gateway:
  type: litellm
  url: os.environ/HARNESS_GATEWAY_URL
  inference_proxy_url: os.environ/HARNESS_INFERENCE_PROXY_URL
  inference_proxy_health_url: os.environ/HARNESS_INFERENCE_PROXY_HEALTH_URL
  internal_allowed_client_id: blue-inference-proxy
  inference_jwt:
    issuer: os.environ/HARNESS_GATEWAY_JWT_ISSUER
    audience: os.environ/HARNESS_GATEWAY_JWT_AUDIENCE
    # The public JWKS is derived from this key; there is no JWKS file.
    private_key_file: os.environ/HARNESS_GATEWAY_JWT_PRIVATE_KEY_FILE
    # Clamped to the remaining browser session. The token is baked into the
    # agent's environment at spawn with no in-flight rotation, so lowering this
    # shortens how long an agent run can keep working.
    token_ttl_seconds: 43200
  secret_encryption:
    provider: environment
    key: os.environ/HARNESS_GATEWAY_ENCRYPTION_KEY
  provisioner:
    type: local-executable
    executable_path: /etc/blue/local-gateway-provisioner.mjs
    executable_sha256: 95f8f55cb695615db465f5184a97933ad2e83811420f4baa979c03c95ba0f965
    policy_revision: local-executable-v4
    reconcile_ttl_seconds: 86400
    model_catalog_refresh_seconds: 300
    timeout_seconds: 15
    max_concurrency: 8
