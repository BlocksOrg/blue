apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blue-namespace-default-deny
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: blue
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blue-migration-access
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: blue
spec:
  podSelector:
    matchLabels:
      blue.blocks.org/migration-access: "true"
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    {{- range .Values.networkPolicy.databaseCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: {{ $.Values.networkPolicy.databasePort }} }]
    {{- end }}
