replicaCount: 1 # development compatibility only; production components use replicas below

image:
  repository: ghcr.io/blocksorg/blue
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""
imagePullSecrets: []

blue:
  # Production enables immutable-image and externally-managed-secret gates.
  # Use values-evaluation.yaml only for non-production evaluation clusters.
  production: true
  enableInferenceProxy: false
  # Required when enableInferenceProxy is true. Must match gateway.type in the
  # mounted Blue configuration; the chart injects it into both services.
  gatewayType: ""
  # OAuth client id the inference proxy presents to the Control API for M2M
  # auth. The dashboard seeds a confidential client with this id, and the
  # Control API pins the token subject to it. The matching client secret must be
  # supplied as HARNESS_PROXY_OAUTH_CLIENT_SECRET via `existingSecret` (shared by
  # the dashboard and inference-proxy pods).
  inferenceProxyClientId: blue-inference-proxy
  inferenceJwt:
    # Secret holding signing-key.pem, the active RSA private key. The Control
    # API derives the published verification keys from it; there is no JWKS.
    # Keep this Secret separate from existingSecret, which every pod loads.
    secret: ""
    audience: blue-inference-proxy
    # During a key rotation, set true and add previous-signing-key.pem (the
    # retired key) to the Secret. Its public key stays published so tokens it
    # signed keep verifying until they expire; it never signs.
    includePreviousKey: false
  internalTransport:
    # mtls (recommended/default) or insecure-http (trusted private networks only).
    mode: mtls
    # Server Secret: ca.crt, tls.crt, tls.key. Client Secret: ca.crt and
    # client.pem (certificate followed by its private key).
    serverSecret: ""
    clientSecret: ""
  existingSecret: ""
  config:
    existingConfigMap: ""
    key: blue.yaml
    mountPath: /etc/blue/blue.yaml
  provisionerExecutable:
    enabled: false
    image:
      repository: ""
      digest: ""
      pullPolicy: IfNotPresent
    executableSha256: ""
  publicUrls:
    dashboard: https://blue.example.com
    controlApi: https://api.blue.example.com
    inferenceProxy: https://inference.blue.example.com
  env: {}

components:
  controlApi:
    replicas: 3
    maxReplicas: 12
  dashboard:
    replicas: 2
  inferenceProxy:
    replicas: 4
    maxReplicas: 30
    maxInFlightPerPod: 7500
  worker:
    replicas: 1

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

service:
  type: ClusterIP
  # Cloud load balancers are configured entirely through Service annotations, so
  # these are what make service.type=LoadBalancer usable without hand-annotating
  # the rendered Services. Applied to every externally reachable Service.
  annotations: {}
  # Per-Service overrides, merged over the shared map above and winning on a key
  # collision. Use them where the backends differ, such as an ALB health-check
  # path: the dashboard answers /api/health and the Control API answers /ready.
  dashboard:
    annotations: {}
  controlApi:
    annotations: {}
  inferenceProxy:
    annotations: {}
  ports:
    dashboard: 3000
    controlApi: 8080
    inferenceProxy: 8081

ingress:
  enabled: false
  className: ""
  annotations: {}
  proxyHost: inference.blue.example.com
  hosts:
    - host: blue.example.com
      paths:
        - path: /
          pathType: Prefix
          port: dashboard
    - host: api.blue.example.com
      paths:
        - path: /
          pathType: Prefix
          port: control-api
  tls: []

resources:
  controlApi:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: 1, memory: 1Gi }
  dashboard:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 500m, memory: 768Mi }
  inferenceProxy:
    requests: { cpu: 1, memory: 1Gi }
    limits: { cpu: 2, memory: 2Gi }
  worker:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1, memory: 1Gi }

startupProbe:
  failureThreshold: 30
  periodSeconds: 10
livenessProbe:
  periodSeconds: 30
  timeoutSeconds: 10
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 30
  targetCPUUtilizationPercentage: 75
  targetActiveStreamsPerProxy: 5000

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

# Evaluation only: render a single-instance PostgreSQL in this release and point
# every workload at it instead of an external database. Production validation
# rejects it — there, supply HARNESS_DATABASE_URL through blue.existingSecret.
database:
  deployStandalone: false
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: blue
    database: blue
    # Empty generates a password on first install and reuses it on upgrades.
    password: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 1, memory: 1Gi }

# Evaluation only: render a single-instance MinIO in this release and point the
# Control API and worker at it instead of external S3-compatible storage. The
# Control API never creates its buckets, so a Job seeds them. Production
# validation rejects it — there, supply the bucket configuration and credentials
# through blue.existingSecret or blue.env.
minio:
  deployStandalone: false
  image:
    repository: quay.io/minio/minio
    tag: RELEASE.2025-09-07T16-13-09Z
    pullPolicy: IfNotPresent
  mcImage:
    repository: quay.io/minio/mc
    tag: RELEASE.2025-08-13T08-35-41Z
    pullPolicy: IfNotPresent
  auth:
    rootUser: blue
    # Empty generates a password on first install and reuses it on upgrades.
    rootPassword: ""
  region: us-east-1
  buckets:
    session: raw-sessions
    package: package-artifacts
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1, memory: 2Gi }
  bucketJob:
    activeDeadlineSeconds: 300
    backoffLimit: 3
    ttlSecondsAfterFinished: 86400
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 256Mi }

migrations:
  enabled: true
  activeDeadlineSeconds: 600
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

networkPolicy:
  enabled: true
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      matchLabels:
        app.kubernetes.io/name: ingress-nginx
  monitoring:
    enabled: false
    namespaceSelector: {}
    podSelector: {}
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  # Cloud load balancers that send traffic straight to pods (an AWS ALB or NLB in
  # IP target mode, for example) come from addresses, not from an ingress pod.
  # List their subnet or VPC CIDRs here to admit them to the dashboard, Control
  # API and inference proxy on their listening ports. Extends ingressController.
  ingressCidrs: []
  # Standard NetworkPolicy cannot match DNS names. Populate these with the
  # narrow cluster/VPC CIDRs for managed dependencies and approved HTTPS hosts.
  databaseCidrs: []
  databasePort: 5432
  redisCidrs: []
  redisPort: 6379
  externalHttpsCidrs: []
  extraEgress: []
