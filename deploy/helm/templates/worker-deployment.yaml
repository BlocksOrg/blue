apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blue.fullname" . }}-worker
  labels:
    {{- include "blue.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.components.worker.replicas }}
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "blue.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "blue.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "blue.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "blue.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["control-api"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - { name: BLUE_HEALTHCHECK_COMPONENT, value: control-api }
            - { name: HARNESS_RUN_BACKGROUND_JOBS, value: "true" }
            - { name: HARNESS_INTERNAL_LISTEN, value: "127.0.0.1:8082" }
            # The worker's internal listener is unused and loopback-only.
            - { name: HARNESS_INTERNAL_TRANSPORT_MODE, value: insecure-http }
            - name: HARNESS_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "blue.databaseSecretName" . | quote }}, key: HARNESS_DATABASE_URL, optional: false }
            {{- if .Values.blue.enableInferenceProxy }}
            - name: HARNESS_GATEWAY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.blue.existingSecret | quote }}, key: HARNESS_GATEWAY_ENCRYPTION_KEY, optional: false }
            # The worker never signs inference tokens, but it loads the same gateway
            # envelope as the API, which declares this key. Pin the path to the mount
            # below so a config file can't point the two pods at different files.
            - { name: HARNESS_GATEWAY_JWT_PRIVATE_KEY_FILE, value: /var/run/blue/gateway-jwt/signing-key.pem }
            {{- if .Values.blue.inferenceJwt.includePreviousKey }}
            - { name: HARNESS_GATEWAY_JWT_PREVIOUS_PRIVATE_KEY_FILE, value: /var/run/blue/gateway-jwt/previous-signing-key.pem }
            {{- end }}
            {{- end }}
            {{- include "blue.storageEnv" . | nindent 12 }}
            {{- range $name, $value := .Values.blue.env }}
            - { name: {{ $name }}, value: {{ $value | quote }} }
            {{- end }}
          envFrom: [{ secretRef: { name: {{ .Values.blue.existingSecret }} } }]
          ports: [{ name: worker-health, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health/worker, port: worker-health }, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: worker-health }, periodSeconds: 30, timeoutSeconds: 10 }
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          {{- if or .Values.blue.config.existingConfigMap .Values.blue.enableInferenceProxy }}
          volumeMounts:
            {{- if .Values.blue.enableInferenceProxy }}
            - { name: gateway-jwt, mountPath: /var/run/blue/gateway-jwt, readOnly: true }
            {{- end }}
            {{- with .Values.blue.config.existingConfigMap }}
            - { name: blue-config, mountPath: {{ $.Values.blue.config.mountPath }}, subPath: {{ $.Values.blue.config.key }}, readOnly: true }
            {{- end }}
          {{- end }}
      {{- if or .Values.blue.config.existingConfigMap .Values.blue.enableInferenceProxy }}
      volumes:
        {{- if .Values.blue.enableInferenceProxy }}
        - name: gateway-jwt
          secret: { secretName: {{ required "blue.inferenceJwt.secret is required when blue.enableInferenceProxy=true" .Values.blue.inferenceJwt.secret | quote }} }
        {{- end }}
        {{- with .Values.blue.config.existingConfigMap }}
        - name: blue-config
          configMap:
            name: {{ . }}
            items: [{ key: {{ $.Values.blue.config.key }}, path: {{ $.Values.blue.config.key }} }]
        {{- end }}
      {{- end }}
