apiVersion: v1
kind: Service
metadata:
  name: {{ include "blue.fullname" . }}-dashboard
  {{- include "blue.serviceAnnotations" (dict "shared" .Values.service.annotations "component" .Values.service.dashboard.annotations) }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "blue.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  ports: [{ name: dashboard, port: {{ .Values.service.ports.dashboard }}, targetPort: dashboard }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blue.fullname" . }}-control-api
  {{- include "blue.serviceAnnotations" (dict "shared" .Values.service.annotations "component" .Values.service.controlApi.annotations) }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "blue.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-api
  ports: [{ name: control-api, port: {{ .Values.service.ports.controlApi }}, targetPort: control-api }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blue.fullname" . }}-control-api-internal
spec:
  type: ClusterIP
  selector:
    {{- include "blue.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-api
  ports: [{ name: gw-internal, port: 8082, targetPort: gw-internal }]
{{- if .Values.blue.enableInferenceProxy }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blue.fullname" . }}-inference-proxy
  {{- include "blue.serviceAnnotations" (dict "shared" .Values.service.annotations "component" .Values.service.inferenceProxy.annotations) }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "blue.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: inference-proxy
  ports: [{ name: inference, port: {{ .Values.service.ports.inferenceProxy }}, targetPort: inference }]
{{- end }}
