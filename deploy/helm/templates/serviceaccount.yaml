{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "blue.serviceAccountName" . }}
  labels:
    {{- include "blue.labels" . | nindent 4 }}
  annotations:
    # The migration Job is a pre-install/pre-upgrade hook that runs as this
    # account, so the account must exist before the hook phase. Without these
    # annotations a fresh install deadlocks: the Job cannot create a pod
    # ("serviceaccount not found") and fails on activeDeadlineSeconds.
    # Weight sorts it ahead of the migration Job's -10.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
