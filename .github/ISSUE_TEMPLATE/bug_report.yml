name: Bug report
description: Report a bug in Blue
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Keep it short and specific — no AI-generated walls of text.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. blue ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Blue version
      description: Output of `blue version`.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS / environment
    validations:
      required: false
