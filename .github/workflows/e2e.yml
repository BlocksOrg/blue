name: End-to-end

on:
  pull_request:
    # `ready_for_review` is NOT in the default type set, and the jobs below skip
    # while the PR is a draft -- without it, marking a PR ready would never
    # trigger e2e until the next push. Every PR here starts as a draft
    # (AGENTS.md), so this is the normal path into the suite, not an edge case.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * *"
  # Escape hatch: dispatch against a branch to run e2e on demand without taking
  # the PR out of draft.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Authoritative one-shot build of the production image + compiled binaries.
  # Every suite below consumes its artifact instead of recompiling the workspace.
  build:
    # Draft PRs skip every suite below, so don't pay for the image build either.
    # The `github.event_name != 'pull_request'` half keeps the push, schedule and
    # workflow_dispatch paths working, where `github.event.pull_request` does not
    # exist.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/images.yml
    # Must cover every job declared in the called workflow, including the
    # registry-mode `merge` job artifact mode never reaches: GitHub validates the
    # callee's permission requests statically at run-creation time, before any
    # `if:` is evaluated. An under-grant kills the whole run at startup with zero
    # jobs and no check-run, so the failure is invisible on the PR. Same union as
    # the release.yml call site.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

  smoke:
    # Draft PRs skip the smoke tier -- it builds the production image and boots
    # the whole hermetic deploy stack, too expensive to pay for on every push to
    # work in progress. Marking the PR ready for review fires `ready_for_review`
    # (see the trigger above) and runs it.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/images
      - run: docker load -i "${RUNNER_TEMP}/images/blue-images.tar"
      - run: tests/e2e/run.sh smoke
        env:
          BLUE_E2E_PREBUILT: "1"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-smoke-${{ github.run_id }}
          path: tests/e2e/artifacts
          if-no-files-found: ignore

  full:
    # PRs get the `smoke` tier only; the 50-test full suite (a strict superset)
    # runs post-merge on main, on the nightly cron, and on demand.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/images
      - run: docker load -i "${RUNNER_TEMP}/images/blue-images.tar"
      - run: tests/e2e/run.sh full
        env:
          BLUE_E2E_PREBUILT: "1"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-full-${{ github.run_id }}
          path: tests/e2e/artifacts
          if-no-files-found: ignore
