name: CLA

# Contributor License Agreement signing via the CLA Assistant bot.
#
# Dormant until a maintainer enables it:
#   1. Create repo variable  ENABLE_CLA = true
#   2. Create repo secret    CLA_SIGNATURES_TOKEN = a PAT (repo scope) that can
#      write to the `cla-signatures` branch created below.
# Signatures are recorded in signatures/cla.json on that branch; the CLA text
# lives in CLA.md. Contributors sign once by commenting on their PR.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      vars.ENABLE_CLA == 'true' &&
      (github.event_name == 'pull_request_target' ||
       github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    steps:
      - name: CLA assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/BlocksOrg/blue/blob/HEAD/CLA.md
          branch: cla-signatures
          allowlist: "*[bot]"
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: >-
            Thanks for your PR! Before we can merge it, please read our
            [Contributor License Agreement](https://github.com/BlocksOrg/blue/blob/HEAD/CLA.md)
            and sign it by posting the following comment:
