name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: vMAJOR.MINOR.PATCH version to assemble from the selected ref without publishing
        required: true
        default: v0.1.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then tag="$GITHUB_REF_NAME"; publish=true; else tag="${{ inputs.tag }}"; publish=false; fi
          scripts/check-release-version.sh "$tag"
          # A draft Release for this tag is expected — release-please creates it
          # when the release PR merges. A *published* one means the tag already
          # shipped, and rebuilding over it would stomp a live release's assets
          # (`upload --clobber`, `edit --latest`). Check before ~30 minutes of
          # builds, not after.
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" == "false" ]]; then
            echo "$tag is already published; refusing to rebuild over it" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "publish=$publish"
            echo "ref=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm ci
        working-directory: apps/docs
      - run: npm run check:release -- "${{ steps.version.outputs.version }}"
        working-directory: apps/docs
      - run: npm run validate
        working-directory: apps/docs

  binaries:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tar
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release -p gh-cli --target ${{ matrix.target }}
      - if: runner.os != 'Windows'
        run: |
          target/${{ matrix.target }}/release/blue version
          mkdir release
          cp target/${{ matrix.target }}/release/blue release/blue
          cp LICENSE release/LICENSE
          tar -czf "blue-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.tar.gz" -C release blue LICENSE
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          target/${{ matrix.target }}/release/blue.exe version
          New-Item -ItemType Directory release
          Copy-Item target/${{ matrix.target }}/release/blue.exe release/blue.exe
          Copy-Item LICENSE release/LICENSE
          Compress-Archive -Path release/blue.exe,release/LICENSE -DestinationPath "blue-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blue-${{ matrix.target }}
          path: blue-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.*
          if-no-files-found: error

  # Multi-arch deployment image. Delegates to the shared build workflow the e2e
  # suites use, so both share the cargo-chef GHA cache. Each arch builds on its
  # own native runner in parallel (no QEMU), then a merge job publishes the
  # manifest. `push` is gated on publish so dispatch dry-runs still validate the
  # build for every arch without touching the registry.
  image:
    needs: validate
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      mode: registry
      enable-arm: true
      push: ${{ needs.validate.outputs.publish == 'true' }}
      tag: ${{ needs.validate.outputs.tag }}
      deployment-version: ${{ needs.validate.outputs.version }}

  publish:
    needs: [validate, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      # Only the per-target binary artifacts. Excludes the `.dockerbuild` build
      # records that build-push-action uploads alongside the image (they fail to
      # extract into the flat release dir under merge-multiple).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          pattern: blue-*
          merge-multiple: true
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release
          format: spdx-json
          output-file: release/blue-sbom.spdx.json
          upload-artifact: false
      - run: |
          cp scripts/install.sh scripts/install.ps1 release/
          BLUE_USE_PUBLISHED_SDK=${{ needs.validate.outputs.publish == 'true' && '1' || '0' }} scripts/package-deployment.sh "${{ needs.validate.outputs.tag }}" release
          helm package deploy/helm --destination release
          cd release
          sha256sum blue-v*.tar.gz blue-v*.zip blue-deployment-* blue-*.tgz blue-sbom.spdx.json install.sh install.ps1 > SHA256SUMS
      - if: needs.validate.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/SHA256SUMS
      - if: needs.validate.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.validate.outputs.publish == 'true'
        run: helm push "release/blue-${{ needs.validate.outputs.version }}.tgz" "oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/charts"
      - if: needs.validate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release-please already created the draft Release holding the
          # changelog, so only create one when it is missing — which keeps the
          # manual `git tag && git push` path working unchanged.
          if ! gh release view "${{ needs.validate.outputs.tag }}" >/dev/null 2>&1; then
            gh release create "${{ needs.validate.outputs.tag }}" --draft --verify-tag --generate-notes --title "${{ needs.validate.outputs.tag }}"
          fi
          gh release upload "${{ needs.validate.outputs.tag }}" release/* --clobber
          gh release edit "${{ needs.validate.outputs.tag }}" --draft=false --latest
      - if: needs.validate.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dry-run-${{ needs.validate.outputs.tag }}
          path: release/*
          if-no-files-found: error
