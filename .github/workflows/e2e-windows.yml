name: End-to-end (Windows CLI)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-launch:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            . -> target
            tests/e2e-windows -> target
      - name: Check Windows E2E harness
        run: |
          cargo fmt --manifest-path tests/e2e-windows/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path tests/e2e-windows/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows CLI journeys
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests/e2e-windows/artifacts | Out-Null
          Start-Transcript -Path tests/e2e-windows/artifacts/run.log
          try { & ./tests/e2e-windows/run.ps1 } finally { Stop-Transcript }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        # The native journey above is the gate; diagnostics must not override its result.
        continue-on-error: true
        with:
          name: windows-cli-e2e
          path: tests/e2e-windows/artifacts
          if-no-files-found: ignore
