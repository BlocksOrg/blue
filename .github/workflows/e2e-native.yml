name: End-to-end (native clients)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
  gateway-secret:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Native gateway NOT RUN: provider secret absent; no certification.' >> "$GITHUB_STEP_SUMMARY"
          fi

  governance:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: blue-e2e-native
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      E2E_NATIVE_BUCKET: ${{ vars.E2E_NATIVE_BUCKET }}
      E2E_NATIVE_SUBNET_ID: ${{ vars.E2E_NATIVE_SUBNET_ID }}
      E2E_NATIVE_SECURITY_GROUP_ID: ${{ vars.E2E_NATIVE_SECURITY_GROUP_ID }}
      E2E_NATIVE_INSTANCE_PROFILE: ${{ vars.E2E_NATIVE_INSTANCE_PROFILE }}
      E2E_NATIVE_AMI_ID: ${{ vars.E2E_NATIVE_AMI_ID }}
      E2E_SLIM_DISPOSABLE_ACCOUNT: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/images
      - name: Install Session Manager (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'SessionManagerPluginSetup.exe'
          Invoke-WebRequest 'https://s3.amazonaws.com/session-manager-downloads/plugin/latest/windows/SessionManagerPluginSetup.exe' -OutFile $installer
          $result = Start-Process -FilePath $installer -ArgumentList '/quiet' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Session Manager installation failed' }
          "$env:ProgramFiles\Amazon\SessionManagerPlugin\bin" >> $env:GITHUB_PATH
      - name: Install Session Manager (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          platform=mac
          if [ "$(uname -m)" = arm64 ]; then platform=mac_arm64; fi
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/$platform/session-manager-plugin.pkg" -o "$RUNNER_TEMP/ssm.pkg"
          sudo installer -pkg "$RUNNER_TEMP/ssm.pkg" -target /
          echo /usr/local/sessionmanagerplugin/bin >> "$GITHUB_PATH"
      - name: Assume dedicated test role
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.E2E_NATIVE_ROLE_ARN }}
          aws-region: ${{ vars.E2E_NATIVE_REGION }}
          role-duration-seconds: 7200
      - run: npm ci --prefix tests/e2e-native --ignore-scripts
      - run: npm test --prefix tests/e2e-native
      - name: Set staging paths
        shell: pwsh
        run: |
          "E2E_NATIVE_IMAGE_TAR=$env:RUNNER_TEMP/images/blue-images.tar" >> $env:GITHUB_ENV
          "E2E_NATIVE_RUN_DIR=$env:RUNNER_TEMP/blue-native-governance" >> $env:GITHUB_ENV
      - name: Shared native governance grid
        id: native
        run: node tests/e2e-native/run.mjs --backend aws --suite governance --matrix
      - name: Always clean leased backend
        if: always() && steps.native.outcome != 'skipped'
        run: node tests/e2e-native/run.mjs --backend aws --suite governance --cleanup-only
      - name: Publish coverage report
        if: always()
        shell: pwsh
        run: |
          if (-not $env:E2E_NATIVE_RUN_DIR) { 'Native suite NOT CERTIFIED: setup did not finish.' >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          $report = Join-Path $env:E2E_NATIVE_RUN_DIR 'coverage.json'
          if (Test-Path $report) { Get-Content $report >> $env:GITHUB_STEP_SUMMARY }
          else { 'Native governance NOT CERTIFIED: no coverage report was produced.' >> $env:GITHUB_STEP_SUMMARY }
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-governance-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.E2E_NATIVE_RUN_DIR }}/coverage.json
            ${{ env.E2E_NATIVE_RUN_DIR }}/lease.json
            ${{ env.E2E_NATIVE_RUN_DIR }}/backend.log
            ${{ env.E2E_NATIVE_RUN_DIR }}/nextest.log
            ${{ env.E2E_NATIVE_RUN_DIR }}/agents/install-report.json
            ${{ env.E2E_NATIVE_RUN_DIR }}/cells/*.json
          if-no-files-found: warn

  gateway:
    needs: [build, gateway-secret]
    if: github.event_name != 'pull_request' && needs.gateway-secret.outputs.present == 'true'
    environment: blue-e2e-native
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      E2E_NATIVE_BUCKET: ${{ vars.E2E_NATIVE_BUCKET }}
      E2E_NATIVE_SUBNET_ID: ${{ vars.E2E_NATIVE_SUBNET_ID }}
      E2E_NATIVE_SECURITY_GROUP_ID: ${{ vars.E2E_NATIVE_SECURITY_GROUP_ID }}
      E2E_NATIVE_INSTANCE_PROFILE: ${{ vars.E2E_NATIVE_INSTANCE_PROFILE }}
      E2E_NATIVE_AMI_ID: ${{ vars.E2E_NATIVE_AMI_ID }}
      E2E_SLIM_DISPOSABLE_ACCOUNT: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/images
      - name: Install Session Manager (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'SessionManagerPluginSetup.exe'
          Invoke-WebRequest 'https://s3.amazonaws.com/session-manager-downloads/plugin/latest/windows/SessionManagerPluginSetup.exe' -OutFile $installer
          $result = Start-Process -FilePath $installer -ArgumentList '/quiet' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Session Manager installation failed' }
          "$env:ProgramFiles\Amazon\SessionManagerPlugin\bin" >> $env:GITHUB_PATH
      - name: Install Session Manager (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          platform=mac
          if [ "$(uname -m)" = arm64 ]; then platform=mac_arm64; fi
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/$platform/session-manager-plugin.pkg" -o "$RUNNER_TEMP/ssm.pkg"
          sudo installer -pkg "$RUNNER_TEMP/ssm.pkg" -target /
          echo /usr/local/sessionmanagerplugin/bin >> "$GITHUB_PATH"
      - name: Assume dedicated test role
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.E2E_NATIVE_ROLE_ARN }}
          aws-region: ${{ vars.E2E_NATIVE_REGION }}
          role-duration-seconds: 7200
      - run: npm ci --prefix tests/e2e-native --ignore-scripts
      - run: npm test --prefix tests/e2e-native
      - name: Set staging paths
        shell: pwsh
        run: |
          "E2E_NATIVE_IMAGE_TAR=$env:RUNNER_TEMP/images/blue-images.tar" >> $env:GITHUB_ENV
          "E2E_NATIVE_RUN_DIR=$env:RUNNER_TEMP/blue-native-gateway" >> $env:GITHUB_ENV
      - name: Shared native gateway grid
        id: native
        run: node tests/e2e-native/run.mjs --backend aws --suite gateway --matrix
      - name: Always clean leased backend
        if: always() && steps.native.outcome != 'skipped'
        run: node tests/e2e-native/run.mjs --backend aws --suite gateway --cleanup-only
      - name: Publish coverage report
        if: always()
        shell: pwsh
        run: |
          if (-not $env:E2E_NATIVE_RUN_DIR) { 'Native suite NOT CERTIFIED: setup did not finish.' >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          $report = Join-Path $env:E2E_NATIVE_RUN_DIR 'coverage.json'
          if (Test-Path $report) { Get-Content $report >> $env:GITHUB_STEP_SUMMARY }
          else { 'Native gateway NOT CERTIFIED: no coverage report was produced.' >> $env:GITHUB_STEP_SUMMARY }
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-gateway-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.E2E_NATIVE_RUN_DIR }}/coverage.json
            ${{ env.E2E_NATIVE_RUN_DIR }}/lease.json
            ${{ env.E2E_NATIVE_RUN_DIR }}/backend.log
            ${{ env.E2E_NATIVE_RUN_DIR }}/nextest.log
            ${{ env.E2E_NATIVE_RUN_DIR }}/agents/install-report.json
            ${{ env.E2E_NATIVE_RUN_DIR }}/cells/*.json
          if-no-files-found: warn
