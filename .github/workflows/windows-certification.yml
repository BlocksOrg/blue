name: Windows desktop certification

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  native-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            labels: [self-hosted, windows, x64, blue-protected]
          - architecture: arm64
            labels: [self-hosted, windows, arm64, blue-protected]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: windows-certification-${{ matrix.architecture }}
      - shell: pwsh
        run: |
          npm install --global @openai/codex@0.151.0 @anthropic-ai/claude-code@2.1.252 @moonshot-ai/kimi-code@0.39.1 opencode-ai@1.18.25
          codex --version
          claude --version
          kimi --version
          opencode --version
      - run: cargo build --locked -p gh-common -p gh-service -p gh-config -p gh-harness -p gh-gateway -p gh-agent -p gh-telemetry -p gh-proxy -p gh-cli
      - run: cargo clippy --locked --all-targets -p gh-common -p gh-service -p gh-config -p gh-harness -p gh-gateway -p gh-agent -p gh-telemetry -p gh-proxy -p gh-cli -- -D warnings
      - shell: pwsh
        run: |
          $Log = Join-Path $env:RUNNER_TEMP "windows-client-tests.log"
          cargo test --locked -p gh-common -p gh-service -p gh-config -p gh-harness -p gh-gateway -p gh-agent -p gh-telemetry -p gh-proxy -p gh-cli 2>&1 | Tee-Object -FilePath $Log
          $Tests = $LASTEXITCODE
          # Redact before exiting: the artifact upload runs `if: always()`, so a
          # failing run — the only one anyone downloads — must not carry the raw
          # log. `$PROFILE` is a PowerShell automatic variable, hence the name.
          $ProfilePattern = [regex]::Escape($env:USERPROFILE)
          (Get-Content $Log -Raw) -replace $ProfilePattern, '<PROFILE>' -replace '(?i)(token|secret|password)=[^\s]+', '$1=<REDACTED>' | Set-Content $Log
          @{
            architecture = "${{ matrix.architecture }}"
            shell = $PSVersionTable.PSEdition
            powershell = $PSVersionTable.PSVersion.ToString()
          } | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP "windows-metadata.json")
          if ($Tests -ne 0) { exit $Tests }
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-certification-${{ matrix.architecture }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/windows-client-tests.log
            ${{ runner.temp }}/windows-metadata.json
          if-no-files-found: ignore
