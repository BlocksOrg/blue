name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede in-flight runs for the same PR. Without this, a rapid push sequence
# keeps every earlier run alive, and this workflow is the expensive one (Rust
# builds plus two Windows jobs) on every push, draft or not.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Does this change touch anything outside docs/website? Gates `image` below.
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read

  # Nothing used to lint the workflow files, which is how both e2e workflows sat
  # at a 100% `startup_failure` rate — invisible, because a startup failure posts
  # no check-run. actionlint catches the class (unknown runner labels, bad
  # expressions, shellcheck over every `run:` block) at PR time instead.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.7
      # sha256 of actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz, from the
      # release's published checksums file.
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict -
          tar -xzf "$tarball" actionlint
      # shellcheck ships on the runner image, so this also lints every `run:`
      # block. Known-intentional findings are suppressed inline at their source.
      - run: ./actionlint -color

  rust-windows-security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo test -p gh-common atomic
      - run: cargo test -p gh-config transaction_tests

  rust-windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all --check
      - run: cargo build --locked -p gh-common -p gh-service -p gh-config -p gh-harness -p gh-gateway -p gh-agent -p gh-telemetry -p gh-proxy -p gh-cli
      - run: cargo clippy --locked --all-targets -p gh-common -p gh-service -p gh-config -p gh-harness -p gh-gateway -p gh-agent -p gh-telemetry -p gh-proxy -p gh-cli -- -D warnings
      - run: cargo test --locked -p gh-common -p gh-service -p gh-config -p gh-harness -p gh-gateway -p gh-agent -p gh-telemetry -p gh-proxy -p gh-cli
      - run: cargo build --locked --release -p gh-cli --target aarch64-pc-windows-msvc

  rust:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://harness:harness@127.0.0.1:5432/governance
      SQLX_OFFLINE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: governance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d governance"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features rustls,postgres
      - run: cargo sqlx migrate run --source services/control-api/migrations
      - run: cargo sqlx prepare --check --workspace -- --all-targets --all-features
      - run: scripts/check-sqlx-queries.sh
      - run: scripts/check-migration-classifications.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo test -p control-api --features postgres-tests

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          # The default wrapper does not forward EOF to the wrapped binary, so
          # `tofu console` (which reads expressions from stdin) hangs forever.
          tofu_wrapper: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # For the release-branch gate below. No `npm ci` — apps/docs/scripts/*.mjs
      # import only `node:` builtins.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: sh -n scripts/install.sh scripts/test-install.sh scripts/test-release-version.sh scripts/package-deployment.sh scripts/check-release-version.sh scripts/set-version.sh deploy/consumer/provisioner.sh
      - run: scripts/test-install.sh
      - run: scripts/test-release-version.sh
      - run: bash -n deploy/blue-entrypoint.sh deploy/blue-healthcheck.sh
      - run: |
          docker compose -f deploy/docker-compose.yml config > /tmp/blue-compose-governance.yaml
          grep -q 'BLUE_CONFIG_OVERLAY_FILES: ""' /tmp/blue-compose-governance.yaml
          if grep -q '^  inference-proxy:' /tmp/blue-compose-governance.yaml; then
            echo "default Compose mode unexpectedly includes inference-proxy" >&2
            exit 1
          fi
          BLUE_CONFIG_OVERLAY_FILES=/etc/blue/blue.capture.yaml \
            docker compose -f deploy/docker-compose.yml config > /tmp/blue-compose-capture.yaml
          grep -q 'BLUE_CONFIG_OVERLAY_FILES: /etc/blue/blue.capture.yaml' /tmp/blue-compose-capture.yaml
          if grep -q '^  inference-proxy:' /tmp/blue-compose-capture.yaml; then
            echo "capture-only Compose mode unexpectedly includes inference-proxy" >&2
            exit 1
          fi
          COMPOSE_PROFILES=gateway \
            BLUE_CONFIG_OVERLAY_FILES=/etc/blue/blue.gateway.yaml \
            docker compose -f deploy/docker-compose.yml config > /tmp/blue-compose-gateway.yaml
          grep -q 'HARNESS_GATEWAY_URL:' /tmp/blue-compose-gateway.yaml
          grep -q 'BLUE_CONFIG_OVERLAY_FILES: /etc/blue/blue.gateway.yaml' /tmp/blue-compose-gateway.yaml
          grep -q '^  inference-proxy:' /tmp/blue-compose-gateway.yaml
          COMPOSE_PROFILES=gateway \
            BLUE_CONFIG_OVERLAY_FILES=/etc/blue/blue.gateway.yaml,/etc/blue/blue.capture.yaml \
            docker compose -f deploy/docker-compose.yml config > /tmp/blue-compose-gateway-capture.yaml
          grep -q 'BLUE_CONFIG_OVERLAY_FILES: /etc/blue/blue.gateway.yaml,/etc/blue/blue.capture.yaml' /tmp/blue-compose-gateway-capture.yaml
          grep -q '^  inference-proxy:' /tmp/blue-compose-gateway-capture.yaml
          if grep -q 'HARNESS_LITELLM_BASE_URL:' /tmp/blue-compose-gateway.yaml; then
            echo "Compose still injects the deprecated HARNESS_LITELLM_BASE_URL" >&2
            exit 1
          fi
      - id: version
        run: |
          version="$(sed -n '/\[workspace.package\]/,/^$/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          scripts/check-release-version.sh "v$version"
      # Holds the merge button shut on an un-finalized release PR — the branch
      # release-please force-pushes carries the new version in the manifest only
      # until release-please.yml's `finalize` job writes it across the tree and
      # freezes the docs snapshot.
      #
      # A step in `packaging` rather than a job of its own, because `packaging`
      # already runs unconditionally, is already a required check, and already
      # runs check-release-version.sh. A separate job could not do this: a
      # path-filtered workflow never emits a check run, and an `if:`-skipped job
      # only ever "passes" through the fail-open `skipped == success` semantics
      # changes.yml warns about. Exits in ~1s on every other PR.
      - name: Gate the release branch on a finalized version and docs snapshot
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "release-please--branches--main" ]; then
            echo "Not the release branch; nothing to gate."
            exit 0
          fi
          # From the manifest, NOT Cargo.toml. Before `finalize` runs, every file
          # still agrees on the previous version — self-consistently wrong, and
          # the step above passes. Reading what release-please decided turns that
          # into a precise message instead of a silent pass.
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync(".release-please-manifest.json", "utf8"))["."]')"
          echo "release-please decided $version"
          if ! scripts/check-release-version.sh "v$version" \
            || ! node apps/docs/scripts/check-release-snapshot.mjs "$version"; then
            echo "::error::Release branch is not finalized for $version. Re-run the Release Please workflow."
            exit 1
          fi
      - run: scripts/verify-deployment.sh
      - run: helm template blue deploy/helm -f deploy/helm/values-evaluation.yaml > /tmp/blue-manifests.yaml
      - run: |
          helm template blue deploy/helm \
            -f deploy/helm/values-evaluation.yaml \
            --set blue.enableInferenceProxy=true \
            --set blue.gatewayType=litellm \
            --set blue.internalTransport.mode=insecure-http \
            > /tmp/blue-gateway-manifests.yaml
          if helm lint deploy/helm \
            -f deploy/helm/values-evaluation.yaml \
            --set blue.enableInferenceProxy=true \
            --set blue.internalTransport.mode=insecure-http; then
            echo "enabled inference proxy without blue.gatewayType unexpectedly passed validation" >&2
            exit 1
          fi
      - run: |
          helm template blue deploy/helm \
            -f deploy/helm/values-evaluation.yaml \
            --set blue.provisionerExecutable.enabled=true \
            --set blue.provisionerExecutable.image.repository=ghcr.io/example/provisioner \
            --set blue.provisionerExecutable.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set blue.provisionerExecutable.executableSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            > /tmp/blue-provisioner-manifests.yaml
          if helm lint deploy/helm -f deploy/helm/values-evaluation.yaml --set blue.provisionerExecutable.enabled=true; then
            echo "enabled provisioner without immutable digests unexpectedly passed validation" >&2
            exit 1
          fi
      - run: tofu fmt -check -recursive deploy/tofu/aws
      - run: tofu -chdir=deploy/tofu/aws init -backend=false
      - run: tofu -chdir=deploy/tofu/aws validate
      - name: Verify generated secret contracts
        run: |
          test "$(printf 'local.bootstrap_admin_password_length\n' \
            | tofu -chdir=deploy/tofu/aws console -input=false -var-file=terraform.tfvars.example)" = 48
          test "$(printf 'local.gateway_jwt_rsa_bits\n' \
            | tofu -chdir=deploy/tofu/aws console -input=false -var-file=terraform.tfvars.example)" = 3072
      - run: scripts/package-deployment.sh "v${{ steps.version.outputs.version }}" /tmp/blue-dist
      - run: tar -tzf "/tmp/blue-dist/blue-deployment-v${{ steps.version.outputs.version }}.tar.gz"

  image:
    needs: changes
    # `!cancelled()` so an infra failure inside `changes` still builds the image.
    # A failed `needs` would otherwise skip this job, and because `image` is a
    # required check, a skipped `image` counts as a *passing* one. Fail open;
    # never silently green.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        run: |
          version="$(sed -n '/\[workspace.package\]/,/^$/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: blue:test
          build-args: BLUE_DEPLOYMENT_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --entrypoint /bin/sh blue:test -c 'test -x /usr/local/bin/control-api && test -x /usr/local/bin/inference-proxy && test -f /opt/blue/dashboard/server.js'
