name: Security gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: scripts/test-security-exceptions.sh
      - run: cargo deny check bans sources
      - name: Audit Rust advisories
        run: |
          set +e
          cargo deny --format json check --warn unmaintained advisories > /tmp/cargo-deny.jsonl 2>&1
          scanner_status=$?
          set -e
          jq -s '[.[] | select(.type == "diagnostic" and .fields.code == "vulnerability") | .fields.advisory.id] | unique' /tmp/cargo-deny.jsonl > /tmp/cargo-deny-findings.json
          scripts/enforce-security-findings.sh cargo-deny /tmp/cargo-deny-findings.json "$scanner_status"
      - name: Audit npm lockfiles
        run: |
          printf '[]' > /tmp/npm-findings.json
          for app in apps/dashboard apps/docs apps/website; do
            set +e
            npm audit --prefix "$app" --package-lock-only --omit=dev --audit-level=high --json > /tmp/npm-audit.json
            scanner_status=$?
            set -e
            jq '[.vulnerabilities[]? | select(.severity == "high" or .severity == "critical") | .via[]? | select(type == "object") | ((.url // (.source | tostring)) | split("/") | last)] | unique' /tmp/npm-audit.json > /tmp/npm-app-findings.json
            jq -s 'add | unique' /tmp/npm-findings.json /tmp/npm-app-findings.json > /tmp/npm-findings-next.json
            mv /tmp/npm-findings-next.json /tmp/npm-findings.json
            if [[ "$scanner_status" != 0 && "$(jq length /tmp/npm-app-findings.json)" == 0 ]]; then exit "$scanner_status"; fi
          done
          scripts/enforce-security-findings.sh npm-audit /tmp/npm-findings.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-security-reports
          path: |
            /tmp/cargo-deny.jsonl
            /tmp/npm-audit.json

  codeql:
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
      - uses: github/codeql-action/analyze@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.25.1"
      - run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - run: gitleaks git --redact --verbose --exit-code 0 --report-format json --report-path /tmp/gitleaks-git.json .
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - run: scripts/verify-deployment.sh
      - name: Scan rendered deployment output
        run: |
          mkdir -p /tmp/blue-rendered
          cp /tmp/blue-production.yaml /tmp/blue-gateway-production.yaml /tmp/blue-rendered/
          gitleaks dir --redact --verbose --exit-code 0 --report-format json --report-path /tmp/gitleaks-rendered.json /tmp/blue-rendered
      - name: Enforce secret findings
        run: |
          test -s /tmp/gitleaks-git.json || printf '[]' > /tmp/gitleaks-git.json
          test -s /tmp/gitleaks-rendered.json || printf '[]' > /tmp/gitleaks-rendered.json
          jq -s '[.[][] | (.Fingerprint // .RuleID)] | unique' /tmp/gitleaks-git.json /tmp/gitleaks-rendered.json > /tmp/gitleaks-findings.json
          scripts/enforce-security-findings.sh gitleaks /tmp/gitleaks-findings.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: secret-scan-reports
          path: |
            /tmp/gitleaks-git.json
            /tmp/gitleaks-rendered.json

  image-and-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: blue:security-scan
          cache-from: type=gha,scope=security
          cache-to: type=gha,mode=max,scope=security
      - name: Scan production image
        run: |
          docker save blue:security-scan --output /tmp/blue-security-scan.tar
          docker run --rm -v /tmp:/reports:rw aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c image --input /reports/blue-security-scan.tar --format json --output /reports/trivy.json --severity HIGH,CRITICAL
          # Keep vendor-unfixed findings in the uploaded report, but gate on
          # actionable high/critical vulnerabilities that have a fixed release.
          jq '[.Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") != "") | .VulnerabilityID] | unique' /tmp/trivy.json > /tmp/trivy-findings.json
          echo "$(jq '[.Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") == "")] | length' /tmp/trivy.json) vendor-unfixed finding(s) retained in the report"
          scripts/enforce-security-findings.sh trivy /tmp/trivy-findings.json
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - run: scripts/verify-deployment.sh
      - run: pip install --disable-pip-version-check checkov==3.2.471
      - name: Scan infrastructure
        run: |
          # CKV2_AWS_11 (VPC flow logs) is deliberately not enforced for this module.
          checkov --directory deploy/tofu/aws --framework terraform --skip-check CKV2_AWS_11 --soft-fail -o json > /tmp/checkov-tofu.json
          checkov --file /tmp/blue-production.yaml --framework kubernetes --soft-fail -o json > /tmp/checkov-kubernetes.json
          jq -s '[.. | objects | .failed_checks? // empty | .[]? | .check_id] | unique' /tmp/checkov-tofu.json /tmp/checkov-kubernetes.json > /tmp/checkov-findings.json
          scripts/enforce-security-findings.sh checkov /tmp/checkov-findings.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-and-iac-security-reports
          path: |
            /tmp/trivy.json
            /tmp/checkov-tofu.json
            /tmp/checkov-kubernetes.json

  network-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.25.1"
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - run: go install sigs.k8s.io/kind@v0.30.0
      - name: Create CNI-less Kind cluster
        run: |
          kind create cluster --config=- <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
          nodes:
            - role: control-plane
          EOF
      - name: Install Cilium
        run: |
          helm repo add cilium https://helm.cilium.io/
          helm install cilium cilium/cilium --version 1.18.1 --namespace kube-system --set ipam.mode=kubernetes --set operator.replicas=1
          kubectl rollout status -n kube-system daemonset/cilium --timeout=5m
      - run: scripts/test-network-policies.sh
