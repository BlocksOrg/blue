version: 2

# Keeps the ecosystems that `security.yml` already *gates* on actually moving:
# `cargo deny check advisories` and `npm audit` fail the build on a known
# vulnerability, but nothing was opening the PR that fixes it.
#
# Grouped by ecosystem and capped at a handful of open PRs each — with a Rust
# workspace this size, ungrouped patch bumps would bury everything else.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # Its own workspace on purpose (see the note in the root Cargo.toml), so it
  # needs its own entry — the root manifest never resolves it.
  - package-ecosystem: cargo
    directory: /tests/e2e-slim
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      e2e-slim-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directories:
      - /apps/dashboard
      - /apps/docs
      - /apps/website
      - /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # Every workflow pins actions by SHA, which means a human (or this) has to
  # move them; a floating tag would have hidden that cost.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
